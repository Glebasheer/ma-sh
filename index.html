<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#2E7D32">
    <title>🌱 VITARAY — Управление производством</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #2E7D32;
            --primary-dark: #1B5E20;
            --primary-light: #4CAF50;
            --primary-bg: #E8F5E9;
            --danger: #C62828;
            --danger-bg: #FFEBEE;
            --text: #1A3A1A;
            --text-secondary: #6B8C6B;
            --bg: #F5FBF5;
            --card: #FFFFFF;
            --border: #E8F5E9;
            --shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.4;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade { animation: fadeIn 0.3s ease; }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            padding: 20px 16px;
            border-radius: 0 0 28px 28px;
            color: white;
            margin-bottom: 16px;
        }
        .header h1 { font-size: 26px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .date-display { font-size: 13px; opacity: 0.9; margin-top: 6px; }

        .nav {
            display: flex;
            gap: 6px;
            padding: 0 12px;
            margin-bottom: 20px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .nav::-webkit-scrollbar { display: none; }
        .nav-btn {
            background: white;
            border: none;
            padding: 10px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            white-space: nowrap;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
        }
        .nav-btn:active { transform: scale(0.96); }

        .section { display: none; padding: 0 12px; }
        .section.active { display: block; animation: fadeIn 0.3s ease; }

        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .card:active { transform: scale(0.99); }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .card-title { font-weight: 700; font-size: 16px; }
        .card-details { font-size: 13px; color: var(--text-secondary); margin: 6px 0; }

        .progress-bar {
            background: var(--primary-bg);
            border-radius: 20px;
            height: 8px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            width: 0%;
            height: 100%;
            border-radius: 20px;
            transition: width 0.5s ease;
        }

        .status {
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 600;
            display: inline-block;
        }
        .status-paid { background: #C8E6C9; color: #1B5E20; }
        .status-unpaid { background: #FFEBEE; color: #C62828; }
        .status-zomachivanie { background: #E3F2FD; color: #1976D2; }
        .status-posev { background: #E8F5E9; color: #2E7D32; }
        .status-v_temi { background: #F3E5F5; color: #7B1FA2; }
        .status-pod_lampoy { background: #FFF3E0; color: #EF6C00; }
        .status-srezka { background: #FCE4EC; color: #C2185B; }
        .status-sbor { background: #C8E6C9; color: #1B5E20; }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin: 8px 0;
            transition: all 0.2s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 1px solid var(--border);
        }
        .btn-small {
            padding: 8px 14px;
            font-size: 12px;
            width: auto;
            margin: 0;
        }
        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger);
            border: 1px solid #FFCDD2;
        }
        .flex-btns { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 12px;
            text-align: center;
        }
        .stat-number { font-size: 20px; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 10px; color: var(--text-secondary); }

        .balance-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            margin-bottom: 16px;
            color: white;
        }
        .balance-amount { font-size: 32px; font-weight: 800; }

        .finance-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .finance-card {
            background: white;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
        }
        .finance-amount { font-size: 16px; font-weight: 700; color: var(--primary); }

        .task-item {
            background: var(--primary-bg);
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .task-checkbox { width: 22px; height: 22px; accent-color: var(--primary); }
        .task-text { flex: 1; font-size: 13px; }

        .plans-block {
            background: #F0F7F0;
            border-radius: 20px;
            padding: 14px;
            margin: 16px 0;
        }
        .plans-title { font-weight: 700; font-size: 14px; margin-bottom: 10px; color: var(--primary); }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }
        .modal-content {
            background: white;
            border-radius: 28px;
            padding: 20px;
            max-width: 500px;
            margin: 20px auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            width: 36px;
            height: 36px;
            border-radius: 20px;
        }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--primary); }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 14px;
            font-size: 14px;
            font-family: inherit;
            background: white;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 30px;
            margin-bottom: 12px;
        }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
        .hint-text { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
        .total-income { font-size: 14px; font-weight: 600; color: var(--primary); margin-top: 8px; text-align: center; padding: 12px; background: var(--primary-bg); border-radius: 20px; }

        .culture-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            flex-wrap: wrap;
        }
        .culture-tab {
            background: white;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
        }
        .culture-tab.active {
            background: var(--primary);
            color: white;
        }
        .edit-icon {
            cursor: pointer;
            padding: 4px 8px;
            background: var(--primary-bg);
            border-radius: 20px;
            font-size: 11px;
            display: inline-block;
        }
        details {
            margin-top: 8px;
        }
        summary {
            cursor: pointer;
            color: var(--primary);
            font-weight: 500;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌱 VITARAY</h1>
        <div class="date-display" id="currentDate"></div>
    </div>

    <div class="nav">
        <button class="nav-btn active" data-section="dashboard">🏠 Главная</button>
        <button class="nav-btn" data-section="parties">🌱 Партии</button>
        <button class="nav-btn" data-section="sales">💰 Продажи</button>
        <button class="nav-btn" data-section="clients">👥 Клиенты</button>
        <button class="nav-btn" data-section="expenses">💸 Расходы</button>
        <button class="nav-btn" data-section="achievements">🏆 Достижения</button>
        <button class="nav-btn" data-section="library">📚 Культуры</button>
    </div>

    <section id="dashboard" class="section active">
        <div class="stats-row" id="mainStats"></div>
        <div class="balance-card">
            <div class="balance-amount" id="currentBalance">0₽</div>
            <div class="balance-label">Текущий баланс</div>
        </div>
        <div class="finance-row" id="financeStats"></div>
        
        <div class="plans-block">
            <div class="plans-title">⏰ СЕГОДНЯ (7:00)</div>
            <div id="morningTasks"></div>
            <div class="plans-title" style="margin-top: 12px;">⏰ СЕГОДНЯ (20:00)</div>
            <div id="eveningTasks"></div>
        </div>

        <h3 style="font-size: 14px; margin: 12px 0 8px;">🌱 АКТИВНЫЕ ПАРТИИ</h3>
        <div id="activePartiesList"></div>
        
        <div class="flex-btns">
            <button class="btn" onclick="showModal('newPartyModal')">➕ Новая партия</button>
            <button class="btn btn-secondary" onclick="showModal('newSaleModal')">💰 Новая продажа</button>
        </div>
    </section>

    <section id="parties" class="section">
        <button class="btn" onclick="showModal('newPartyModal')">🌱 Создать партию</button>
        <div id="partiesList"></div>
    </section>

    <section id="sales" class="section">
        <button class="btn" onclick="showModal('newSaleModal')">💰 Записать продажу</button>
        <div id="salesList"></div>
        <div class="total-income" id="totalIncomeDisplay"></div>
    </section>

    <section id="clients" class="section">
        <button class="btn" onclick="showModal('newClientModal')">👥 Добавить клиента</button>
        <input type="text" id="clientSearch" class="search-input" placeholder="🔍 Поиск клиента..." onkeyup="filterClients()">
        <div id="clientsList"></div>
    </section>

    <section id="expenses" class="section">
        <button class="btn" onclick="showModal('newExpenseModal')">💸 Добавить расход</button>
        <div class="finance-row" id="expensesStats"></div>
        <div id="expensesList"></div>
    </section>

    <section id="achievements" class="section">
        <button class="btn" onclick="showModal('newAchievementModal')">🏆 Добавить достижение</button>
        <div id="achievementsList"></div>
    </section>

    <section id="library" class="section">
        <button class="btn btn-secondary" onclick="showModal('newCultureModal')">➕ Добавить культуру</button>
        <div id="culturesList"></div>
    </section>

    <!-- Модальные окна -->
    <div id="newPartyModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>🌱 НОВАЯ ПАРТИЯ</h3><button class="close-btn" onclick="hideModal('newPartyModal')">×</button></div>
    <form id="newPartyForm"><div class="form-group"><label>Культура *</label><select id="partyCulture" required></select></div>
    <div class="form-group"><label>Вес сухих семян (г) *</label><input type="number" id="partyWeight" required><div id="partyWeightHint" class="hint-text"></div></div>
    <div class="form-group"><label>Дата посева *</label><input type="date" id="partyDate" required></div>
    <div class="form-group"><label>Тип контейнера *</label><select id="partyContainer" required><option value="15x11">15×11</option><option value="8x5">8×5</option><option value="proraschivatel">Проращиватель</option></select></div>
    <div class="form-group"><label>Заметки</label><textarea id="partyNotes" rows="2"></textarea></div>
    <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newPartyModal')">Отмена</button><button type="submit" class="btn-small">Создать</button></div></form></div></div>

    <div id="newSaleModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>💰 НОВАЯ ПРОДАЖА</h3><button class="close-btn" onclick="hideModal('newSaleModal')">×</button></div>
    <form id="newSaleForm"><div class="form-group"><label>Клиент *</label><select id="saleClient" required></select></div>
    <div class="form-group"><label>Дата *</label><input type="date" id="saleDate" required></div>
    <div class="form-group"><label>Культура</label><select id="saleCulture"><option value="горох">Горох</option><option value="редис">Редис</option><option value="маш">Маш</option><option value="нут">Нут</option><option value="соя">Соя</option><option value="горчица">Горчица</option></select></div>
    <div class="form-group"><label>Количество (г) *</label><input type="number" id="saleWeight" required placeholder="например: 150"></div>
    <div class="form-group"><label>Сумма (₽) *</label><input type="number" id="saleAmount" required placeholder="например: 150"></div>
    <div class="form-group"><label>Оплачено</label><select id="salePaid"><option value="true">Да</option><option value="false">Нет</option></select></div>
    <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newSaleModal')">Отмена</button><button type="submit" class="btn-small">Записать</button></div></form></div></div>

    <div id="newClientModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>👥 НОВЫЙ КЛИЕНТ</h3><button class="close-btn" onclick="hideModal('newClientModal')">×</button></div>
    <form id="newClientForm"><div class="form-group"><label>Имя *</label><input type="text" id="clientName" required></div>
    <div class="form-group"><label>Место</label><input type="text" id="clientPlace"></div>
    <div class="form-group"><label>Контакт</label><input type="text" id="clientContact"></div>
    <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newClientModal')">Отмена</button><button type="submit" class="btn-small">Добавить</button></div></form></div></div>

    <div id="newExpenseModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>💸 НОВЫЙ РАСХОД</h3><button class="close-btn" onclick="hideModal('newExpenseModal')">×</button></div>
    <form id="newExpenseForm"><div class="form-group"><label>Дата *</label><input type="date" id="expenseDate" required></div>
    <div class="form-group"><label>Категория *</label><select id="expenseCategory"><option>Семена</option><option>Оборудование</option><option>Упаковка</option><option>Лотки</option><option>Субстрат</option></select></div>
    <div class="form-group"><label>Наименование *</label><input type="text" id="expenseName" required></div>
    <div class="form-group"><label>Сумма (₽) *</label><input type="number" id="expenseAmount" required></div>
    <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newExpenseModal')">Отмена</button><button type="submit" class="btn-small">Добавить</button></div></form></div></div>

    <div id="newAchievementModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>🏆 НОВОЕ ДОСТИЖЕНИЕ</h3><button class="close-btn" onclick="hideModal('newAchievementModal')">×</button></div>
    <form id="newAchievementForm"><div class="form-group"><label>Дата *</label><input type="date" id="achievementDate" required></div>
    <div class="form-group"><label>Описание *</label><input type="text" id="achievementDesc" required></div>
    <div class="form-group"><label>Категория</label><select id="achievementCategory"><option>Продажи</option><option>Производство</option><option>Клиенты</option></select></div>
    <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newAchievementModal')">Отмена</button><button type="submit" class="btn-small">Добавить</button></div></form></div></div>

    <div id="newCultureModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>🌱 НОВАЯ КУЛЬТУРА</h3><button class="close-btn" onclick="hideModal('newCultureModal')">×</button></div>
    <form id="newCultureForm"><div class="form-group"><label>Название *</label><input type="text" id="cultureName" required></div>
    <div class="form-group"><label>Тип *</label><select id="cultureType"><option value="microgreen">Микрозелень</option><option value="sprouts">Проростки</option></select></div>
    <div class="form-group"><label>Норма для 15×11 (г)</label><input type="number" id="cultureNorm15" value="25"></div>
    <div class="form-group"><label>Норма для 8×5 (г)</label><input type="number" id="cultureNorm8" value="4"></div>
    <div class="form-group"><label>Норма для проращивателя (г)</label><input type="number" id="cultureNormPro" value="25"></div>
    <div class="form-group"><label>Цена семян (₽/г)</label><input type="number" id="cultureSeedPrice" step="0.001" value="0.163"></div>
    <div class="form-group"><label>Дней до готовности</label><input type="number" id="cultureDays" value="10"></div>
    <div class="form-group"><label>Инструкция</label><textarea id="cultureInstructions" rows="6" placeholder="1. Замочить на 12 часов..."></textarea></div>
    <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newCultureModal')">Отмена</button><button type="submit" class="btn-small">Создать</button></div></form></div></div>

    <div id="editCultureModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>✏️ РЕДАКТИРОВАТЬ КУЛЬТУРУ</h3><button class="close-btn" onclick="hideModal('editCultureModal')">×</button></div>
    <form id="editCultureForm"><input type="hidden" id="editCultureName"><div class="form-group"><label>Тип</label><select id="editCultureType"><option value="microgreen">Микрозелень</option><option value="sprouts">Проростки</option></select></div>
    <div class="form-group"><label>Норма для 15×11 (г)</label><input type="number" id="editCultureNorm15"></div>
    <div class="form-group"><label>Норма для 8×5 (г)</label><input type="number" id="editCultureNorm8"></div>
    <div class="form-group"><label>Норма для проращивателя (г)</label><input type="number" id="editCultureNormPro"></div>
    <div class="form-group"><label>Цена семян (₽/г)</label><input type="number" id="editCultureSeedPrice" step="0.001"></div>
    <div class="form-group"><label>Дней до готовности</label><input type="number" id="editCultureDays"></div>
    <div class="form-group"><label>Инструкция</label><textarea id="editCultureInstructions" rows="8"></textarea></div>
    <div class="flex-btns"><button type="button" class="btn-danger btn-small" onclick="deleteCultureFromModal()">🗑️ Удалить</button><button type="button" class="btn-secondary btn-small" onclick="hideModal('editCultureModal')">Отмена</button><button type="submit" class="btn-small">Сохранить</button></div></form></div></div>

                norm15: 30, norm8: 5, normPro: 30, 
                seedPrice: 0.44, daysToReady: 6, 
                instructions: "🟢 СОЯ (проростки)\n\n📌 ЗАМАЧИВАНИЕ (10–12 ч):\nПервые 15–20 мин — вода с перекисью. Затем промыть, залить чистой водой.\n\n📌 СУБСТРАТ:\nДжут (залить кипятком, отжать) или сетка.\n\n📌 ПОСЕВ:\nРазложить ровным слоем.\n\n📌 ГРУЗ:\nНЕ СТАВИТЬ.\n\n📌 СВЕТ:\nПолная темнота до срезки.\n\n📌 ПРОМЫВКА:\n2 раза в день прохладной кипячёной водой.\n\n📌 ПРОВЕТРИВАНИЕ:\n2 раза в день.\n\n📌 СРЕЗКА (6–7 день):\nВысота 7–9 см." 
            }
        };

        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        const STORAGE_KEYS = {
            parties: 'vitaray_parties',
            sales: 'vitaray_sales',
            clients: 'vitaray_clients',
            expenses: 'vitaray_expenses',
            achievements: 'vitaray_achievements',
            cultures: 'vitaray_cultures'
        };

        function initData() {
            if (!localStorage.getItem(STORAGE_KEYS.cultures)) localStorage.setItem(STORAGE_KEYS.cultures, JSON.stringify(DEFAULT_CULTURES));
            if (!localStorage.getItem(STORAGE_KEYS.clients)) localStorage.setItem(STORAGE_KEYS.clients, JSON.stringify(DEFAULT_CLIENTS));
            if (!localStorage.getItem(STORAGE_KEYS.sales)) localStorage.setItem(STORAGE_KEYS.sales, JSON.stringify(DEFAULT_SALES));
            if (!localStorage.getItem(STORAGE_KEYS.achievements)) localStorage.setItem(STORAGE_KEYS.achievements, JSON.stringify(DEFAULT_ACHIEVEMENTS));
            if (!localStorage.getItem(STORAGE_KEYS.expenses)) localStorage.setItem(STORAGE_KEYS.expenses, JSON.stringify(DEFAULT_EXPENSES));
            if (!localStorage.getItem(STORAGE_KEYS.parties)) localStorage.setItem(STORAGE_KEYS.parties, JSON.stringify([]));
        }

        function loadKey(key) { return JSON.parse(localStorage.getItem(key)) || []; }
        function saveKey(key, data) { localStorage.setItem(key, JSON.stringify(data)); }
        function getCultures() { return JSON.parse(localStorage.getItem(STORAGE_KEYS.cultures)); }

        // ==================== ВСПОМОГАТЕЛЬНЫЕ ====================
        function getStageName(stage) {
            const names = { zomachivanie: 'Замачивание', posev: 'Посев', v_temi: 'В тени', pod_lampoy: 'Под лампой', srezka: 'Срезка', sbor: 'Сбор' };
            return names[stage] || stage;
        }

        function getStagesForCulture(culture, cultures) {
            const cult = cultures[culture];
            if (cult?.type === 'microgreen') return ['zomachivanie', 'posev', 'v_temi', 'pod_lampoy', 'srezka'];
            return ['zomachivanie', 'posev', 'sbor'];
        }

        function getProgressPercent(party, cultures) {
            const stages = getStagesForCulture(party.culture, cultures);
            const idx = stages.indexOf(party.currentStage);
            return ((idx + 1) / stages.length) * 100;
        }

        function getClientName(id) {
            const c = loadKey(STORAGE_KEYS.clients).find(c => c.id === id);
            return c ? c.name : 'Клиент';
        }

        function getFinancialStats() {
            const sales = loadKey(STORAGE_KEYS.sales);
            const expenses = loadKey(STORAGE_KEYS.expenses);
            const paidSales = sales.filter(s => s.paid === true);
            const totalIncome = paidSales.reduce((s, sale) => s + sale.amount, 0);
            const totalExpenses = expenses.reduce((s, e) => s + e.amount, 0);
            const today = new Date().toISOString().slice(0, 10);
            const weekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);
            const monthAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);
            return {
                totalIncome, totalExpenses, currentBalance: totalIncome - totalExpenses,
                weekIncome: paidSales.filter(s => s.date >= weekAgo).reduce((s, sale) => s + sale.amount, 0),
                monthIncome: paidSales.filter(s => s.date >= monthAgo).reduce((s, sale) => s + sale.amount, 0),
                weekExpenses: expenses.filter(e => e.date >= weekAgo).reduce((s, e) => s + e.amount, 0),
                monthExpenses: expenses.filter(e => e.date >= monthAgo).reduce((s, e) => s + e.amount, 0)
            };
        }

        function generateTasks() {
            const parties = loadKey(STORAGE_KEYS.parties);
            const cultures = getCultures();
            const morning = [], evening = [];
            const today = new Date().toISOString().slice(0, 10);
            
            parties.forEach(p => {
                const cult = cultures[p.culture];
                if (!cult) return;
                if (p.currentStage === 'v_temi' || p.currentStage === 'pod_lampoy') {
                    morning.push(`🌱 Проветрить ${p.culture} #${p.id.slice(-4)}`);
                    evening.push(`🌱 Проветрить ${p.culture} #${p.id.slice(-4)}`);
                }
                if (cult.type === 'sprouts' && (p.currentStage === 'posev' || p.currentStage === 'v_temi')) {
                    morning.push(`💧 Промыть ${p.culture} #${p.id.slice(-4)}`);
                    evening.push(`💧 Промыть ${p.culture} #${p.id.slice(-4)}`);
                }
                if (p.currentStage === 'srezka' || p.currentStage === 'sbor') morning.push(`✂️ Срезать ${p.culture} #${p.id.slice(-4)}`);
                if (p.currentStage === 'zomachivanie') {
                    const soakDate = new Date(p.createdAt);
                    const readyDate = new Date(soakDate.getTime() + 12 * 60 * 60 * 1000);
                    if (readyDate.toISOString().slice(0, 10) === today) evening.push(`🌱 Посеять ${p.culture} #${p.id.slice(-4)} (замачивание закончено)`);
                }
            });
            
            document.getElementById('morningTasks').innerHTML = morning.length ? morning.map(t => `<div class="task-item"><input type="checkbox" class="task-checkbox"><span class="task-text">${t}</span></div>`).join('') : '<div class="empty-state">✨ Нет задач на утро</div>';
            document.getElementById('eveningTasks').innerHTML = evening.length ? evening.map(t => `<div class="task-item"><input type="checkbox" class="task-checkbox"><span class="task-text">${t}</span></div>`).join('') : '<div class="empty-state">✨ Нет задач на вечер</div>';
        }

        // ==================== РЕНДЕР ====================
        function renderDashboard() {
            const parties = loadKey(STORAGE_KEYS.parties);
            const clients = loadKey(STORAGE_KEYS.clients);
            const fin = getFinancialStats();
            const cultures = getCultures();
            
            document.getElementById('mainStats').innerHTML = `
                <div class="stat-card"><div class="stat-number">${fin.weekIncome}₽</div><div class="stat-label">За неделю</div></div>
                <div class="stat-card"><div class="stat-number">${fin.monthIncome}₽</div><div class="stat-label">За месяц</div></div>
                <div class="stat-card"><div class="stat-number">${clients.length}</div><div class="stat-label">Клиенты</div></div>`;
            document.getElementById('currentBalance').textContent = fin.currentBalance + '₽';
            document.getElementById('financeStats').innerHTML = `
                <div class="finance-card"><div class="finance-amount">${fin.totalIncome}₽</div><div class="finance-period">Всего доход</div></div>
                <div class="finance-card"><div class="finance-amount">${fin.totalExpenses}₽</div><div class="finance-period">Всего расход</div></div>`;
            
            const activeParties = parties.filter(p => !['srezka', 'sbor'].includes(p.currentStage)).slice(0, 3);
            document.getElementById('activePartiesList').innerHTML = activeParties.length ? activeParties.map(p => {
                const progress = getProgressPercent(p, cultures);
                const cult = cultures[p.culture];
                const harvestDate = new Date(p.dateSown);
                harvestDate.setDate(harvestDate.getDate() + (cult?.daysToReady || 7));
                return `<div class="card"><div class="card-header"><span class="card-title">🌱 ${p.culture} #${p.id.slice(-4)}</span><span class="status status-${p.currentStage}">${getStageName(p.currentStage)}</span></div><div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div><div class="card-details">${p.container} • ${p.weight}г • Посев: ${p.dateSown} • Сбор: ${harvestDate.toLocaleDateString()}</div><div class="flex-btns"><button class="btn-small btn-secondary" onclick="nextStage('${p.id}')">➡️ Следующий этап</button></div></div>`;
            }).join('') : '<div class="empty-state">Нет активных партий</div>';
            
            generateTasks();
        }

        function renderParties() {
            const parties = loadKey(STORAGE_KEYS.parties);
            const cultures = getCultures();
            document.getElementById('partiesList').innerHTML = parties.length ? parties.slice().reverse().map(p => {
                const progress = getProgressPercent(p, cultures);
                const cult = cultures[p.culture];
                const harvestDate = new Date(p.dateSown);
                harvestDate.setDate(harvestDate.getDate() + (cult?.daysToReady || 7));
                return `<div class="card"><div class="card-header"><span class="card-title">🌱 ${p.culture} #${p.id.slice(-4)}</span><span class="status status-${p.currentStage}">${getStageName(p.currentStage)}</span></div><div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div><div class="card-details">${p.container} • ${p.weight}г • Посев: ${p.dateSown} • Сбор: ${harvestDate.toLocaleDateString()}</div>${p.notes ? `<div class="card-details">📝 ${p.notes}</div>` : ''}<div class="flex-btns"><button class="btn-small btn-secondary" onclick="nextStage('${p.id}')">➡️ Следующий этап</button><button class="btn-small btn-danger" onclick="deleteParty('${p.id}')">🗑️</button></div></div>`;
            }).join('') : '<div class="empty-state">Нет партий</div>';
        }

        window.nextStage = (id) => {
            let parties = loadKey(STORAGE_KEYS.parties);
            const cultures = getCultures();
            const p = parties.find(p => p.id === id);
            if (!p) return;
            const stages = getStagesForCulture(p.culture, cultures);
            const idx = stages.indexOf(p.currentStage);
            if (idx < stages.length - 1) {
                p.currentStage = stages[idx + 1];
                saveKey(STORAGE_KEYS.parties, parties);
                renderDashboard();
                renderParties();
            } else alert('🎉 Партия завершена!');
        };

        window.deleteParty = (id) => {
            if (confirm('Удалить партию?')) {
                let parties = loadKey(STORAGE_KEYS.parties).filter(p => p.id !== id);
                saveKey(STORAGE_KEYS.parties, parties);
                renderDashboard();
                renderParties();
            }
        };

        function renderSales() {
            const sales = loadKey(STORAGE_KEYS.sales);
            const totalIncome = sales.filter(s => s.paid).reduce((sum, s) => sum + s.amount, 0);
            document.getElementById('salesList').innerHTML = sales.length ? sales.slice().reverse().map(s => `
                <div class="card"><div class="card-header"><span class="card-title">💰 ${getClientName(s.clientId)}</span><span class="status ${s.paid ? 'status-paid' : 'status-unpaid'}">${s.paid ? 'Оплачено' : 'Не оплачено'}</span></div><div class="card-details">${s.culture} • ${s.weight}г • ${s.amount}₽</div><div class="card-details">📅 ${s.date}</div><div class="flex-btns">${!s.paid ? `<button class="btn-small btn-secondary" onclick="toggleSalePaid('${s.id}')">✅ Оплатить</button>` : ''}<button class="btn-small btn-danger" onclick="deleteSale('${s.id}')">🗑️</button></div></div>
            `).join('') : '<div class="empty-state">Нет продаж</div>';
            document.getElementById('totalIncomeDisplay').innerHTML = `💰 ВСЕГО ДОХОД: ${totalIncome}₽ (${sales.length} продаж)`;
        }

        window.toggleSalePaid = (id) => {
            let sales = loadKey(STORAGE_KEYS.sales);
            let sale = sales.find(s => s.id === id);
            if (sale) { sale.paid = !sale.paid; saveKey(STORAGE_KEYS.sales, sales); renderDashboard(); renderSales(); }
        };

        window.deleteSale = (id) => {
            if (confirm('Удалить продажу?')) {
                let sales = loadKey(STORAGE_KEYS.sales).filter(s => s.id !== id);
                saveKey(STORAGE_KEYS.sales, sales);
                renderDashboard();
                renderSales();
            }
        };

        function renderClients(filter = '') {
            let clients = loadKey(STORAGE_KEYS.clients);
            const sales = loadKey(STORAGE_KEYS.sales);
            if (filter) clients = clients.filter(c => c.name.toLowerCase().includes(filter.toLowerCase()));
            
            document.getElementById('clientsList').innerHTML = clients.map(c => {
                const clientSales = sales.filter(s => s.clientId === c.id);
                const totalPaid = clientSales.filter(s => s.paid).reduce((sum, s) => sum + s.amount, 0);
                const totalUnpaid = clientSales.filter(s => !s.paid).reduce((sum, s) => sum + s.amount, 0);
                return `<div class="card"><div class="card-header"><span class="card-title">👤 ${c.name}</span></div><div class="card-details">📍 ${c.place || '—'} • 📞 ${c.contact || '—'}</div><div class="card-details">💰 Продаж: ${clientSales.length} • Оплачено: ${totalPaid}₽ • Долг: ${totalUnpaid}₽</div><div class="flex-btns"><button class="btn-small btn-secondary" onclick="quickSale('${c.id}')">💰 Продажа</button><button class="btn-small btn-danger" onclick="deleteClient('${c.id}')">🗑️</button></div></div>`;
            }).join('') || '<div class="empty-state">Нет клиентов</div>';
        }

        window.quickSale = (id) => { showModal('newSaleModal'); setTimeout(() => { document.getElementById('saleClient').value = id; }, 100); };
        window.deleteClient = (id) => { if (confirm('Удалить клиента?')) { let c = loadKey(STORAGE_KEYS.clients).filter(x => x.id !== id); saveKey(STORAGE_KEYS.clients, c); renderClients(); } };
        window.filterClients = () => renderClients(document.getElementById('clientSearch').value);

        function renderExpenses() {
            const expenses = loadKey(STORAGE_KEYS.expenses);
            const fin = getFinancialStats();
            document.getElementById('expensesStats').innerHTML = `
                <div class="finance-card"><div class="finance-amount">${fin.weekExpenses}₽</div><div class="finance-period">За неделю</div></div>
                <div class="finance-card"><div class="finance-amount">${fin.monthExpenses}₽</div><div class="finance-period">За месяц</div></div>`;
            document.getElementById('expensesList').innerHTML = expenses.slice().reverse().map(e => `<div class="card"><div class="card-header"><span class="card-title">${e.name}</span><span class="status status-pending">${e.category}</span></div><div class="card-details">📅 ${e.date} • 💸 ${e.amount}₽</div><div class="flex-btns"><button class="btn-small btn-danger" onclick="deleteExpense('${e.id}')">🗑️</button></div></div>`).join('') || '<div class="empty-state">Нет расходов</div>';
        }

        window.deleteExpense = (id) => { if (confirm('Удалить расход?')) { let e = loadKey(STORAGE_KEYS.expenses).filter(x => x.id !== id); saveKey(STORAGE_KEYS.expenses, e); renderExpenses(); renderDashboard(); } };

        function renderAchievements() {
            const a = loadKey(STORAGE_KEYS.achievements);
            document.getElementById('achievementsList').innerHTML = a.slice().reverse().map(ac => `<div class="card"><div class="card-header"><span class="card-title">🏆 ${ac.description}</span><button class="btn-small btn-danger" onclick="deleteAchievement('${ac.id}')">🗑️</button></div><div class="card-details">📅 ${ac.date} • ${ac.category}</div></div>`).join('') || '<div class="empty-state">Нет достижений</div>';
        }

        window.deleteAchievement = (id) => { if (confirm('Удалить?')) { let a = loadKey(STORAGE_KEYS.achievements).filter(x => x.id !== id); saveKey(STORAGE_KEYS.achievements, a); renderAchievements(); } };

        function renderLibrary() {
            const cultures = getCultures();
            const cultureNames = Object.keys(cultures);
            let html = `<div class="culture-tabs">`;
            cultureNames.forEach((name, idx) => {
                html += `<button class="culture-tab ${idx === 0 ? 'active' : ''}" onclick="showCulture('${name}')">${name === 'горох' ? '🌱' : name === 'редис' ? '🔴' : name === 'горчица' ? '🟢' : name === 'маш' ? '🟡' : name === 'нут' ? '🟤' : '🟢'} ${name}</button>`;
            });
            html += `</div><div id="selectedCulture"></div>`;
            document.getElementById('culturesList').innerHTML = html;
            if (cultureNames.length > 0) showCulture(cultureNames[0]);
        }

        window.showCulture = (name) => {
            const cultures = getCultures();
            const c = cultures[name];
            if (!c) return;
            const normCost = (c.norm8 * c.seedPrice).toFixed(2);
            document.getElementById('selectedCulture').innerHTML = `
                <div class="card"><div class="card-header"><span class="card-title">🌱 ${name.toUpperCase()}</span><span class="edit-icon" onclick="editCulture('${name}')">✏️ Редактировать</span></div>
                <div class="card-details"><strong>📊 ОСНОВНЫЕ ПАРАМЕТРЫ:</strong><br>• Тип: ${c.type === 'microgreen' ? 'Микрозелень' : 'Проростки'}<br>• Норма 15×11: ${c.norm15} г<br>• Норма 8×5: ${c.norm8} г<br>• Норма проращиватель: ${c.normPro} г<br>• Цена семян: ${c.seedPrice} ₽/г<br>• Дней до готовности: ${c.daysToReady}</div>
                <div class="card-details"><strong>💰 СЕБЕСТОИМОСТЬ 8×5:</strong> ${normCost} ₽ (только семена)</div>
                <details><summary>📖 ПОЛНАЯ ИНСТРУКЦИЯ</summary><div class="card-details" style="margin-top: 8px; white-space: pre-line;">${c.instructions}</div></details></div>
            `;
        };

        window.editCulture = (name) => {
            const cultures = getCultures();
            const c = cultures[name];
            document.getElementById('editCultureName').value = name;
            document.getElementById('editCultureType').value = c.type;
            document.getElementById('editCultureNorm15').value = c.norm15;
            document.getElementById('editCultureNorm8').value = c.norm8;
            document.getElementById('editCultureNormPro').value = c.normPro;
            document.getElementById('editCultureSeedPrice').value = c.seedPrice;
            document.getElementById('editCultureDays').value = c.daysToReady;
            document.getElementById('editCultureInstructions').value = c.instructions;
            showModal('editCultureModal');
        };

        window.deleteCultureFromModal = () => {
            const name = document.getElementById('editCultureName').value;
            if (confirm(`Удалить культуру "${name}"?`)) {
                let cultures = getCultures();
                delete cultures[name];
                saveKey(STORAGE_KEYS.cultures, cultures);
                hideModal('editCultureModal');
                renderLibrary();
                fillSelectors();
            }
        };

        // ==================== ФОРМЫ ====================
        function fillSelectors() {
            const clients = loadKey(STORAGE_KEYS.clients);
            const cultures = getCultures();
            const cultureSelect = document.getElementById('partyCulture');
            if (cultureSelect) cultureSelect.innerHTML = Object.keys(cultures).map(c => `<option value="${c}">${c}</option>`).join('');
            const clientSelect = document.getElementById('saleClient');
            if (clientSelect) clientSelect.innerHTML = clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }

        function updateWeightHint() {
            const culture = document.getElementById('partyCulture').value;
            const container = document.getElementById('partyContainer').value;
            const cultures = getCultures();
            const cult = cultures[culture];
            if (cult) {
                let norm = container === '15x11' ? cult.norm15 : container === '8x5' ? cult.norm8 : cult.normPro;
                document.getElementById('partyWeightHint').innerHTML = `📌 Рекомендация: ${norm}г для ${container === '15x11' ? '15×11' : container === '8x5' ? '8×5' : 'проращивателя'}`;
                document.getElementById('partyWeight').placeholder = norm;
            }
        }

        document.getElementById('newPartyForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const parties = loadKey(STORAGE_KEYS.parties);
            parties.push({
                id: `p${Date.now()}`,
                culture: document.getElementById('partyCulture').value,
                container: document.getElementById('partyContainer').value,
                weight: parseInt(document.getElementById('partyWeight').value),
                dateSown: document.getElementById('partyDate').value,
                notes: document.getElementById('partyNotes').value,
                currentStage: 'zomachivanie',
                createdAt: new Date().toISOString()
            });
            saveKey(STORAGE_KEYS.parties, parties);
            hideModal('newPartyModal');
            document.getElementById('newPartyForm').reset();
            renderDashboard();
            renderParties();
            alert('✅ Партия создана!');
        });

        document.getElementById('newSaleForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const sales = loadKey(STORAGE_KEYS.sales);
            sales.push({
                id: `s${Date.now()}`,
                clientId: document.getElementById('saleClient').value,
                date: document.getElementById('saleDate').value,
                culture: document.getElementById('saleCulture').value,
                weight: parseInt(document.getElementById('saleWeight').value),
                amount: parseInt(document.getElementById('saleAmount').value),
                paid: document.getElementById('salePaid').value === 'true',
                createdAt: new Date().toISOString()
            });
            saveKey(STORAGE_KEYS.sales, sales);
            hideModal('newSaleModal');
            document.getElementById('newSaleForm').reset();
            renderDashboard();
            renderSales();
            alert('✅ Продажа записана!');
        });

        document.getElementById('newClientForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const clients = loadKey(STORAGE_KEYS.clients);
            clients.push({
                id: `c${Date.now()}`,
                name: document.getElementById('clientName').value,
                place: document.getElementById('clientPlace').value,
                contact: document.getElementById('clientContact').value,
                createdAt: new Date().toISOString()
            });
            saveKey(STORAGE_KEYS.clients, clients);
            hideModal('newClientModal');
            document.getElementById('newClientForm').reset();
            renderClients();
            fillSelectors();
            alert('✅ Клиент добавлен!');
        });

        document.getElementById('newExpenseForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const expenses = loadKey(STORAGE_KEYS.expenses);
            expenses.push({
                id: `e${Date.now()}`,
                date: document.getElementById('expenseDate').value,
                name: document.getElementById('expenseName').value,
                amount: parseInt(document.getElementById('expenseAmount').value),
                category: document.getElementById('expenseCategory').value,
                createdAt: new Date().toISOString()
            });
            saveKey(STORAGE_KEYS.expenses, expenses);
            hideModal('newExpenseModal');
            document.getElementById('newExpenseForm').reset();
            renderExpenses();
            renderDashboard();
            alert('✅ Расход добавлен!');
        });

        document.getElementById('newAchievementForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const ach = loadKey(STORAGE_KEYS.achievements);
            ach.push({
                id: `a${Date.now()}`,
                date: document.getElementById('achievementDate').value,
                description: document.getElementById('achievementDesc').value,
                category: document.getElementById('achievementCategory').value,
                createdAt: new Date().toISOString()
            });
            saveKey(STORAGE_KEYS.achievements, ach);
            hideModal('newAchievementModal');
            document.getElementById('newAchievementForm').reset();
            renderAchievements();
            alert('✅ Достижение добавлено!');
        });

        document.getElementById('newCultureForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const cultures = getCultures();
            const name = document.getElementById('cultureName').value.toLowerCase();
            if (cultures[name]) {
                alert('Такая культура уже существует!');
                return;
            }
            cultures[name] = {
                type: document.getElementById('cultureType').value,
                norm15: parseInt(document.getElementById('cultureNorm15').value),
                norm8: parseInt(document.getElementById('cultureNorm8').value),
                normPro: parseInt(document.getElementById('cultureNormPro').value),
                seedPrice: parseFloat(document.getElementById('cultureSeedPrice').value),
                daysToReady: parseInt(document.getElementById('cultureDays').value),
                instructions: document.getElementById('cultureInstructions').value
            };
            saveKey(STORAGE_KEYS.cultures, cultures);
            hideModal('newCultureModal');
            document.getElementById('newCultureForm').reset();
            renderLibrary();
            fillSelectors();
            alert('✅ Культура добавлена!');
        });

        document.getElementById('editCultureForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('editCultureName').value;
            const cultures = getCultures();
            cultures[name] = {
                type: document.getElementById('editCultureType').value,
                norm15: parseInt(document.getElementById('editCultureNorm15').value),
                norm8: parseInt(document.getElementById('editCultureNorm8').value),
                normPro: parseInt(document.getElementById('editCultureNormPro').value),
                seedPrice: parseFloat(document.getElementById('editCultureSeedPrice').value),
                daysToReady: parseInt(document.getElementById('editCultureDays').value),
                instructions: document.getElementById('editCultureInstructions').value
            };
            saveKey(STORAGE_KEYS.cultures, cultures);
            hideModal('editCultureModal');
            renderLibrary();
            fillSelectors();
            alert('✅ Культура сохранена!');
        });

        // ==================== НАВИГАЦИЯ ====================
        window.showModal = (id) => { fillSelectors(); document.getElementById(id).style.display = 'block'; };
        window.hideModal = (id) => document.getElementById(id).style.display = 'none';

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                this.classList.add('active');
                const sec = this.getAttribute('data-section');
                document.getElementById(sec).classList.add('active');
                if (sec === 'dashboard') renderDashboard();
                if (sec === 'parties') renderParties();
                if (sec === 'sales') renderSales();
                if (sec === 'clients') renderClients();
                if (sec === 'expenses') renderExpenses();
                if (sec === 'achievements') renderAchievements();
                if (sec === 'library') renderLibrary();
            });
        });

        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
        document.getElementById('partyCulture')?.addEventListener('change', updateWeightHint);
        document.getElementById('partyContainer')?.addEventListener('change', updateWeightHint);
        document.getElementById('saleDate').valueAsDate = new Date();
        document.getElementById('expenseDate').valueAsDate = new Date();
        document.getElementById('achievementDate').valueAsDate = new Date();

        initData();
        renderDashboard();
        renderParties();
        renderSales();
        renderClients();
        renderExpenses();
        renderAchievements();
        renderLibrary();
        fillSelectors();
        
        console.log('✅ VITARAY загружен!');
        const totalIncome = loadKey(STORAGE_KEYS.sales).filter(s => s.paid).reduce((sum, s) => sum + s.amount, 0);
        const totalExpenses = loadKey(STORAGE_KEYS.expenses).reduce((sum, e) => sum + e.amount, 0);
        console.log(`📊 Всего продаж: ${loadKey(STORAGE_KEYS.sales).length}`);
        console.log(`👥 Всего клиентов: ${loadKey(STORAGE_KEYS.clients).length}`);
        console.log(`💰 Общая выручка: ${totalIncome}₽`);
        console.log(`💸 Всего расходов: ${totalExpenses}₽`);
        console.log(`💎 Текущий баланс: ${totalIncome - totalExpenses}₽`);
    </script>
</body>
</html>
