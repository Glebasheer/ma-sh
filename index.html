<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🌱 VITARAY — Управление производством</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(135deg, #F8FDF8 0%, #E8F5E9 100%);
            color: #1A3A1A;
            line-height: 1.4;
            min-height: 100vh;
            padding: 16px 16px 80px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #2E7D32, #4CAF50);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .date-display {
            color: #6B8C6B;
            font-size: 13px;
            margin-top: 4px;
        }

        /* Navigation */
        .nav {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }
        .nav-btn {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(8px);
            border: 1px solid #C8E6C9;
            padding: 10px 16px;
            border-radius: 40px;
            color: #2E7D32;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .nav-btn.active {
            background: linear-gradient(135deg, #2E7D32, #4CAF50);
            color: white;
            border-color: transparent;
        }

        /* Sections */
        .section {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .section.active {
            display: block;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #E8F5E9;
        }
        .stat-number {
            font-size: 24px;
            font-weight: 800;
            color: #2E7D32;
        }
        .stat-label {
            font-size: 11px;
            color: #81C784;
            font-weight: 500;
        }

        /* Finance Cards */
        .balance-card {
            background: linear-gradient(135deg, #2E7D32, #4CAF50);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            margin-bottom: 16px;
            color: white;
        }
        .balance-amount {
            font-size: 28px;
            font-weight: 800;
        }
        .balance-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .finance-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .finance-card {
            background: white;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            border: 1px solid #E8F5E9;
        }
        .finance-amount {
            font-size: 16px;
            font-weight: 700;
            color: #2E7D32;
        }
        .finance-period {
            font-size: 10px;
            color: #81C784;
        }

        /* Expense Stats */
        .expense-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .expense-card {
            background: white;
            border-radius: 14px;
            padding: 10px;
            text-align: center;
            border: 1px solid #FFEBEE;
        }
        .expense-amount {
            font-size: 14px;
            font-weight: 700;
            color: #C62828;
        }
        .expense-period {
            font-size: 9px;
            color: #999;
        }

        /* Buttons */
        .btn {
            background: linear-gradient(135deg, #2E7D32, #4CAF50);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin: 8px 0;
            transition: all 0.2s;
        }
        .btn-secondary {
            background: white;
            color: #2E7D32;
            border: 1px solid #C8E6C9;
        }
        .btn-small {
            padding: 6px 12px;
            font-size: 11px;
            width: auto;
            margin: 0;
        }
        .btn-danger {
            background: linear-gradient(135deg, #EF5350, #E53935);
        }

        /* Cards */
        .card {
            background: white;
            border-radius: 20px;
            padding: 14px;
            margin: 10px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #E8F5E9;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .card-title {
            font-weight: 700;
            font-size: 14px;
        }
        .card-details {
            font-size: 12px;
            color: #666;
            margin: 6px 0;
        }

        /* Progress Bar */
        .progress-bar {
            background: #E8F5E9;
            border-radius: 20px;
            height: 6px;
            margin: 8px 0;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, #2E7D32, #4CAF50);
            width: 0%;
            height: 100%;
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        /* Status Badges */
        .status {
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 600;
        }
        .status-paid { background: #C8E6C9; color: #1B5E20; }
        .status-unpaid { background: #FFEBEE; color: #C62828; }
        .status-delivered { background: #E0F2FE; color: #0369a1; }
        .status-pending { background: #FFF3E0; color: #EF6C00; }
        .status-zomachivanie { background: #E3F2FD; color: #1976D2; }
        .status-posev { background: #E8F5E9; color: #2E7D32; }
        .status-v_temi { background: #F3E5F5; color: #7B1FA2; }
        .status-pod_lampoy { background: #FFF3E0; color: #EF6C00; }
        .status-srezka { background: #FCE4EC; color: #C2185B; }
        .status-sbor { background: #C8E6C9; color: #1B5E20; }

        /* Tables */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 16px;
            background: white;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .data-table th {
            text-align: left;
            padding: 10px 8px;
            background: #F8FDF8;
            color: #2E7D32;
            font-weight: 600;
            border-bottom: 1px solid #E8F5E9;
        }
        .data-table td {
            padding: 8px;
            border-bottom: 1px solid #F0F4F0;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 28px;
            max-width: 500px;
            margin: 40px auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #2E7D32;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        /* Forms */
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #2E7D32;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #E8F5E9;
            border-radius: 14px;
            font-size: 14px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .flex-btns {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #81C784;
            font-size: 13px;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #E8F5E9;
            border-radius: 30px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .expense-stats { grid-template-columns: repeat(2, 1fr); }
            .finance-row { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌱 VITARAY</h1>
        <div class="date-display" id="currentDate"></div>
    </div>

    <nav class="nav">
        <button class="nav-btn active" data-section="dashboard">🏠 Главная</button>
        <button class="nav-btn" data-section="parties">🌱 Партии</button>
        <button class="nav-btn" data-section="orders">📦 Заказы</button>
        <button class="nav-btn" data-section="clients">👥 Клиенты</button>
        <button class="nav-btn" data-section="expenses">💰 Расходы</button>
        <button class="nav-btn" data-section="achievements">🏆 Достижения</button>
    </nav>

    <!-- DASHBOARD -->
    <section id="dashboard" class="section active">
        <div class="stats-grid" id="mainStats"></div>
        <div class="balance-card">
            <div class="balance-amount" id="currentBalance">0₽</div>
            <div class="balance-label">Текущий баланс</div>
        </div>
        <div class="finance-row" id="financeStats"></div>
        
        <h3 style="font-size: 14px; margin: 12px 0 8px;">📦 Активные партии</h3>
        <div id="activePartiesList"></div>
        
        <h3 style="font-size: 14px; margin: 12px 0 8px;">💰 Последние заказы</h3>
        <div id="recentOrdersList"></div>
        
        <div class="flex-btns">
            <button class="btn" onclick="showModal('newPartyModal')">🌱 Новая партия</button>
            <button class="btn btn-secondary" onclick="showModal('newOrderModal')">📦 Новый заказ</button>
        </div>
    </section>

    <!-- PARTIES -->
    <section id="parties" class="section">
        <button class="btn" onclick="showModal('newPartyModal')">🌱 Создать партию</button>
        <div id="partiesList"></div>
    </section>

    <!-- ORDERS -->
    <section id="orders" class="section">
        <button class="btn" onclick="showModal('newOrderModal')">📋 Создать заказ</button>
        <div id="ordersList"></div>
    </section>

    <!-- CLIENTS -->
    <section id="clients" class="section">
        <button class="btn" onclick="showModal('newClientModal')">👥 Добавить клиента</button>
        <input type="text" id="clientSearch" class="search-input" placeholder="🔍 Поиск клиента..." onkeyup="filterClients()">
        <div id="clientsList"></div>
    </section>

    <!-- EXPENSES -->
    <section id="expenses" class="section">
        <button class="btn" onclick="showModal('newExpenseModal')">💸 Добавить расход</button>
        <div class="balance-card" style="background: linear-gradient(135deg, #C62828, #EF5350); margin-top: 12px;">
            <div class="balance-amount" id="expensesBalance">0₽</div>
            <div class="balance-label">Баланс с учетом расходов</div>
        </div>
        <div class="expense-stats" id="expenseStats"></div>
        <h3 style="font-size: 14px; margin: 12px 0 8px;">📋 Все расходы</h3>
        <div id="expensesTable"></div>
    </section>

    <!-- ACHIEVEMENTS -->
    <section id="achievements" class="section">
        <button class="btn" onclick="showModal('newAchievementModal')">🏆 Добавить достижение</button>
        <div id="achievementsList"></div>
    </section>

    <!-- MODALS -->
    <div id="newPartyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 class="modal-title">🌱 Новая партия</h3><button class="close-btn" onclick="hideModal('newPartyModal')">×</button></div>
            <form id="newPartyForm">
                <div class="form-group"><label>Культура</label><input type="text" id="partyCulture" placeholder="горох, маш, редис" required></div>
                <div class="form-group"><label>Тип</label><select id="partyType"><option value="microgreen">Микрозелень (5 этапов)</option><option value="sprouts">Проростки (3 этапа)</option></select></div>
                <div class="form-group"><label>Формат лотка</label><input type="text" id="partyFormat" value="15×11"></div>
                <div class="form-group"><label>Вес сухих семян (г)</label><input type="number" id="partyWeightDry" value="30" required></div>
                <div class="form-group"><label>Дата посева</label><input type="date" id="partyDateSown" required></div>
                <div class="form-group"><label>Субстрат</label><input type="text" id="partySubstrate" value="джут"></div>
                <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newPartyModal')">Отмена</button><button type="submit" class="btn-small">Создать</button></div>
            </form>
        </div>
    </div>

    <div id="newOrderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 class="modal-title">📋 Новый заказ</h3><button class="close-btn" onclick="hideModal('newOrderModal')">×</button></div>
            <form id="newOrderForm">
                <div class="form-group"><label>Клиент</label><select id="orderClient" required></select></div>
                <div class="form-group"><label>Дата</label><input type="date" id="orderDate" required></div>
                <div class="form-group"><label>Продукт</label><input type="text" id="orderProduct" placeholder="горох, маш..." required></div>
                <div class="form-group"><label>Количество (лотков)</label><input type="number" id="orderQty" value="1" required></div>
                <div class="form-group"><label>Цена за лоток (₽)</label><input type="number" id="orderPrice" required></div>
                <div class="form-group"><label>Партия (опционально)</label><select id="orderPartyId"><option value="">Не выбрано</option></select></div>
                <div class="form-group"><label>Оплачен</label><select id="orderPaid"><option value="false">Нет</option><option value="true">Да</option></select></div>
                <div class="form-group"><label>Выдан</label><select id="orderDelivered"><option value="false">Нет</option><option value="true">Да</option></select></div>
                <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newOrderModal')">Отмена</button><button type="submit" class="btn-small">Создать</button></div>
            </form>
        </div>
    </div>

    <div id="newClientModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 class="modal-title">👥 Новый клиент</h3><button class="close-btn" onclick="hideModal('newClientModal')">×</button></div>
            <form id="newClientForm">
                <div class="form-group"><label>Имя</label><input type="text" id="clientName" required></div>
                <div class="form-group"><label>Место/Адрес</label><input type="text" id="clientAddress"></div>
                <div class="form-group"><label>Контакт</label><input type="text" id="clientContact"></div>
                <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newClientModal')">Отмена</button><button type="submit" class="btn-small">Добавить</button></div>
            </form>
        </div>
    </div>

    <div id="newExpenseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 class="modal-title">💸 Новый расход</h3><button class="close-btn" onclick="hideModal('newExpenseModal')">×</button></div>
            <form id="newExpenseForm">
                <div class="form-group"><label>Дата</label><input type="date" id="expenseDate" required></div>
                <div class="form-group"><label>Наименование</label><input type="text" id="expenseName" required></div>
                <div class="form-group"><label>Сумма (₽)</label><input type="number" id="expenseAmount" required></div>
                <div class="form-group"><label>Категория</label><select id="expenseCategory"><option value="Оборудование">Оборудование</option><option value="Контейнеры">Контейнеры</option><option value="Семена">Семена</option><option value="Субстрат">Субстрат</option><option value="Упаковка">Упаковка</option><option value="Прочее">Прочее</option></select></div>
                <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newExpenseModal')">Отмена</button><button type="submit" class="btn-small">Добавить</button></div>
            </form>
        </div>
    </div>

    <div id="newAchievementModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 class="modal-title">🏆 Новое достижение</h3><button class="close-btn" onclick="hideModal('newAchievementModal')">×</button></div>
            <form id="newAchievementForm">
                <div class="form-group"><label>Дата</label><input type="date" id="achievementDate" required></div>
                <div class="form-group"><label>Описание</label><input type="text" id="achievementDesc" required></div>
                <div class="form-group"><label>Категория</label><select id="achievementCategory"><option value="Производство">Производство</option><option value="Продажи">Продажи</option><option value="Клиенты">Клиенты</option></select></div>
                <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newAchievementModal')">Отмена</button><button type="submit" class="btn-small">Добавить</button></div>
            </form>
        </div>
    </div>

    <div id="editExpenseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 class="modal-title">✏️ Редактировать расход</h3><button class="close-btn" onclick="hideModal('editExpenseModal')">×</button></div>
            <form id="editExpenseForm">
                <input type="hidden" id="editExpenseId">
                <div class="form-group"><label>Дата</label><input type="date" id="editExpenseDate" required></div>
                <div class="form-group"><label>Наименование</label><input type="text" id="editExpenseName" required></div>
                <div class="form-group"><label>Сумма (₽)</label><input type="number" id="editExpenseAmount" required></div>
                <div class="form-group"><label>Категория</label><select id="editExpenseCategory"></select></div>
                <div class="flex-btns"><button type="button" class="btn-danger btn-small" onclick="deleteExpenseFromModal()">🗑️ Удалить</button><button type="button" class="btn-secondary btn-small" onclick="hideModal('editExpenseModal')">Отмена</button><button type="submit" class="btn-small">Сохранить</button></div>
            </form>
        </div>
    </div>

    <div id="editOrderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 class="modal-title">✏️ Редактировать заказ</h3><button class="close-btn" onclick="hideModal('editOrderModal')">×</button></div>
            <form id="editOrderForm">
                <input type="hidden" id="editOrderId">
                <div class="form-group"><label>Клиент</label><select id="editOrderClient" required></select></div>
                <div class="form-group"><label>Дата</label><input type="date" id="editOrderDate" required></div>
                <div class="form-group"><label>Продукт</label><input type="text" id="editOrderProduct" required></div>
                <div class="form-group"><label>Количество</label><input type="number" id="editOrderQty" required></div>
                <div class="form-group"><label>Цена (₽)</label><input type="number" id="editOrderPrice" required></div>
                <div class="form-group"><label>Оплачен</label><select id="editOrderPaid"><option value="false">Нет</option><option value="true">Да</option></select></div>
                <div class="form-group"><label>Выдан</label><select id="editOrderDelivered"><option value="false">Нет</option><option value="true">Да</option></select></div>
                <div class="flex-btns"><button type="button" class="btn-danger btn-small" onclick="deleteOrderFromModal()">🗑️ Удалить</button><button type="button" class="btn-secondary btn-small" onclick="hideModal('editOrderModal')">Отмена</button><button type="submit" class="btn-small">Сохранить</button></div>
            </form>
        </div>
    </div>

    <div id="editPartyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 class="modal-title">✏️ Редактировать партию</h3><button class="close-btn" onclick="hideModal('editPartyModal')">×</button></div>
            <form id="editPartyForm">
                <input type="hidden" id="editPartyId">
                <div class="form-group"><label>Культура</label><input type="text" id="editPartyCulture" required></div>
                <div class="form-group"><label>Тип</label><select id="editPartyType"><option value="microgreen">Микрозелень</option><option value="sprouts">Проростки</option></select></div>
                <div class="form-group"><label>Формат</label><input type="text" id="editPartyFormat"></div>
                <div class="form-group"><label>Вес сухих семян (г)</label><input type="number" id="editPartyWeightDry" required></div>
                <div class="form-group"><label>Дата посева</label><input type="date" id="editPartyDateSown" required></div>
                <div class="form-group"><label>Текущий этап</label><select id="editPartyStage"></select></div>
                <div class="flex-btns"><button type="button" class="btn-danger btn-small" onclick="deletePartyFromModal()">🗑️ Удалить</button><button type="button" class="btn-secondary btn-small" onclick="hideModal('editPartyModal')">Отмена</button><button type="submit" class="btn-small">Сохранить</button></div>
            </form>
        </div>
    </div>

    <div id="viewClientModal" class="modal">
        <div class="modal-content" id="viewClientContent"></div>
    </div>

    <script>
        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        const STORAGE_KEYS = {
            parties: 'vitaray_parties',
            orders: 'vitaray_orders',
            clients: 'vitaray_clients',
            expenses: 'vitaray_expenses',
            achievements: 'vitaray_achievements'
        };

        // Финансовые расчеты
        function getFinancialStats() {
            const orders = loadKey(STORAGE_KEYS.orders);
            const expenses = loadKey(STORAGE_KEYS.expenses);
            const now = new Date();
            const today = now.toISOString().slice(0,10);
            const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000).toISOString().slice(0,10);
            const monthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000).toISOString().slice(0,10);
            
            const paidOrders = orders.filter(o => o.paid === true);
            const totalIncome = paidOrders.reduce((s, o) => s + o.total, 0);
            const totalExpenses = expenses.reduce((s, e) => s + e.amount, 0);
            const currentBalance = totalIncome - totalExpenses;
            
            const todayIncome = paidOrders.filter(o => o.date === today).reduce((s, o) => s + o.total, 0);
            const weekIncome = paidOrders.filter(o => o.date >= weekAgo).reduce((s, o) => s + o.total, 0);
            const monthIncome = paidOrders.filter(o => o.date >= monthAgo).reduce((s, o) => s + o.total, 0);
            
            const todayExpenses = expenses.filter(e => e.date === today).reduce((s, e) => s + e.amount, 0);
            const weekExpenses = expenses.filter(e => e.date >= weekAgo).reduce((s, e) => s + e.amount, 0);
            const monthExpenses = expenses.filter(e => e.date >= monthAgo).reduce((s, e) => s + e.amount, 0);
            
            return { totalIncome, totalExpenses, currentBalance, todayIncome, weekIncome, monthIncome, todayExpenses, weekExpenses, monthExpenses };
        }

        function getStageName(stage) {
            const names = { zomachivanie: 'Замачивание', posev: 'Посев', v_temi: 'В тени', pod_lampoy: 'Под лампой', srezka: 'Срезка', sbor: 'Сбор' };
            return names[stage] || stage;
        }

        function getProgressPercent(party) {
            const stages = party.cultureType === 'microgreen' 
                ? ['zomachivanie', 'posev', 'v_temi', 'pod_lampoy', 'srezka']
                : ['zomachivanie', 'posev', 'sbor'];
            const index = stages.indexOf(party.currentStage);
            return ((index + 1) / stages.length) * 100;
        }

        window.nextStage = (id) => {
            let parties = loadKey(STORAGE_KEYS.parties);

                ? ['zomachivanie', 'posev', 'v_temi', 'pod_lampoy', 'srezka']
                : ['zomachivanie', 'posev', 'sbor'];
            const idx = stages.indexOf(party.currentStage);
            if (idx < stages.length - 1) {
                party.currentStage = stages[idx + 1];
                if (!party.stages) party.stages = {};
                party.stages[party.currentStage] = new Date().toISOString();
                saveKey(STORAGE_KEYS.parties, parties);
                renderDashboard();
                renderParties();

                document.getElementById('editExpenseDate').value = expense.date;
                document.getElementById('editExpenseName').value = expense.name;
                document.getElementById('editExpenseAmount').value = expense.amount;
                const catSelect = document.getElementById('editExpenseCategory');
                catSelect.innerHTML = ['Оборудование', 'Контейнеры', 'Семена', 'Субстрат', 'Упаковка', 'Прочее'].map(c => `<option value="${c}" ${c === expense.category ? 'selected' : ''}>${c}</option>`).join('');
                showModal('editExpenseModal');
            }
        };

        window.deleteExpenseFromModal = () => {
            if (!confirm('Удалить расход?')) return;
            const id = document.getElementById('editExpenseId').value;
            let expenses = loadKey(STORAGE_KEYS.expenses);
            expenses = expenses.filter(e => e.id !== id);
            saveKey(STORAGE_KEYS.expenses, expenses);
            hideModal('editExpenseModal');
            renderExpenses();
            renderDashboard();
        };

        function renderAchievements() {
            const achievements = loadKey(STORAGE_KEYS.achievements);
            const div = document.getElementById('achievementsList');
            if (!achievements.length) { div.innerHTML = '<div class="empty-state">Нет достижений</div>'; return; }
            div.innerHTML = achievements.slice().reverse().map(a => `<div class="card"><div class="card-header"><b>🏆 ${a.description}</b><button class="btn-small btn-danger" onclick="deleteAchievement('${a.id}')">🗑️</button></div><div class="card-details">📅 ${a.date} • ${a.category}</div></div>`).join('');
        }

        window.deleteAchievement = (id) => { if(confirm('Удалить достижение?')) { let achievements = loadKey(STORAGE_KEYS.achievements); achievements = achievements.filter(a => a.id !== id); saveKey(STORAGE_KEYS.achievements, achievements); renderAchievements(); } };

        // Формы
        function fillSelectors() {
            const clients = loadKey(STORAGE_KEYS.clients);
            const parties = loadKey(STORAGE_KEYS.parties);
            const clientSelect = document.getElementById('orderClient');
            if (clientSelect) clientSelect.innerHTML = clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            const partySelect = document.getElementById('orderPartyId');
            if (partySelect) partySelect.innerHTML = '<option value="">Не выбрано</option>' + parties.map(p => `<option value="${p.id}">${p.culture} (${p.dateSown})</option>`).join('');
        }

        document.getElementById('newPartyForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            let parties = loadKey(STORAGE_KEYS.parties);
            const cultureType = document.getElementById('partyType').value;
            const now = new Date().toISOString();
            parties.push({
                id: `p${Date.now()}`,
                culture: document.getElementById('partyCulture').value,
                cultureType: cultureType,
                format: document.getElementById('partyFormat').value,
                dateSown: document.getElementById('partyDateSown').value,
                weightDry: parseInt(document.getElementById('partyWeightDry').value),
                substrate: document.getElementById('partySubstrate').value,
                currentStage: 'zomachivanie',
                stages: { zomachivanie: now, posev: null, v_temi: null, pod_lampoy: null, srezka: null, sbor: null },
                createdAt: now
            });
            saveKey(STORAGE_KEYS.parties, parties);
            hideModal('newPartyModal');
            renderParties();
            renderDashboard();
        });

        document.getElementById('newOrderForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            let orders = loadKey(STORAGE_KEYS.orders);
            const qty = parseInt(document.getElementById('orderQty').value);
            const price = parseInt(document.getElementById('orderPrice').value);
            orders.push({
                id: `o${Date.now()}`,
                clientId: document.getElementById('orderClient').value,
                date: document.getElementById('orderDate').value,
                items: [{ product: document.getElementById('orderProduct').value, format: '15×11', quantity: qty, price: price }],
                total: qty * price,
                paid: document.getElementById('orderPaid').value === 'true',
                delivered: document.getElementById('orderDelivered').value === 'true',
                partyId: document.getElementById('orderPartyId').value || null,
                createdAt: new Date().toISOString()
            });
            saveKey(STORAGE_KEYS.orders, orders);
            hideModal('newOrderModal');
            renderOrders();
            renderDashboard();
        });

        document.getElementById('newClientForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            let clients = loadKey(STORAGE_KEYS.clients);
            clients.push({
                id: `c${Date.now()}`,
                name: document.getElementById('clientName').value,
                address: document.getElementById('clientAddress').value,
                contact: document.getElementById('clientContact').value,
                createdAt: new Date().toISOString()
            });
            saveKey(STORAGE_KEYS.clients, clients);
            hideModal('newClientModal');
            renderClients();
            fillSelectors();
        });

        document.getElementById('newExpenseForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            let expenses = loadKey(STORAGE_KEYS.expenses);
            expenses.push({
                id: `e${Date.now()}`,
                date: document.getElementById('expenseDate').value,
                name: document.getElementById('expenseName').value,
                amount: parseInt(document.getElementById('expenseAmount').value),
                category: document.getElementById('expenseCategory').value,
                createdAt: new Date().toISOString()
            });
            saveKey(STORAGE_KEYS.expenses, expenses);
            hideModal('newExpenseModal');
            renderExpenses();
            renderDashboard();
        });

        document.getElementById('newAchievementForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            let achievements = loadKey(STORAGE_KEYS.achievements);
            achievements.push({
                id: `a${Date.now()}`,
                date: document.getElementById('achievementDate').value,
                description: document.getElementById('achievementDesc').value,
                category: document.getElementById('achievementCategory').value,
                createdAt: new Date().toISOString()
            });
            saveKey(STORAGE_KEYS.achievements, achievements);
            hideModal('newAchievementModal');
            renderAchievements();
        });

        document.getElementById('editPartyForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('editPartyId').value;
            let parties = loadKey(STORAGE_KEYS.parties);
            const index = parties.findIndex(p => p.id === id);
            if (index !== -1) {
                parties[index] = {
                    ...parties[index],
                    culture: document.getElementById('editPartyCulture').value,
                    cultureType: document.getElementById('editPartyType').value,
                    format: document.getElementById('editPartyFormat').value,
                    weightDry: parseInt(document.getElementById('editPartyWeightDry').value),
                    dateSown: document.getElementById('editPartyDateSown').value,
                    currentStage: document.getElementById('editPartyStage').value
                };
                saveKey(STORAGE_KEYS.parties, parties);
                hideModal('editPartyModal');
                renderParties();
                renderDashboard();
            }
        });

        document.getElementById('editOrderForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('editOrderId').value;
            let orders = loadKey(STORAGE_KEYS.orders);
            const index = orders.findIndex(o => o.id === id);
            if (index !== -1) {
                const qty = parseInt(document.getElementById('editOrderQty').value);
                const price = parseInt(document.getElementById('editOrderPrice').value);
                orders[index] = {
                    ...orders[index],
                    clientId: document.getElementById('editOrderClient').value,
                    date: document.getElementById('editOrderDate').value,
                    items: [{ product: document.getElementById('editOrderProduct').value, format: '15×11', quantity: qty, price: price }],
                    total: qty * price,
                    paid: document.getElementById('editOrderPaid').value === 'true',
                    delivered: document.getElementById('editOrderDelivered').value === 'true'
                };
                saveKey(STORAGE_KEYS.orders, orders);
                hideModal('editOrderModal');
                renderOrders();
                renderDashboard();
            }
        });

        document.getElementById('editExpenseForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('editExpenseId').value;
            let expenses = loadKey(STORAGE_KEYS.expenses);
            const index = expenses.findIndex(e => e.id === id);
            if (index !== -1) {
                expenses[index] = {
                    ...expenses[index],
                    date: document.getElementById('editExpenseDate').value,
                    name: document.getElementById('editExpenseName').value,
                    amount: parseInt(document.getElementById('editExpenseAmount').value),
                    category: document.getElementById('editExpenseCategory').value
                };
                saveKey(STORAGE_KEYS.expenses, expenses);
                hideModal('editExpenseModal');
                renderExpenses();
                renderDashboard();
            }
        });

        window.showModal = (id) => { fillSelectors(); document.getElementById(id).style.display = 'block'; };
        window.hideModal = (id) => document.getElementById(id).style.display = 'none';

        // Навигация
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                this.classList.add('active');
                const section = this.getAttribute('data-section');
                document.getElementById(section).classList.add('active');
                if (section === 'dashboard') renderDashboard();
                if (section === 'parties') renderParties();
                if (section === 'orders') renderOrders();
                if (section === 'clients') renderClients();
                if (section === 'expenses') renderExpenses();
                if (section === 'achievements') renderAchievements();
            });
        });

        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
        
        renderDashboard();
        renderParties();
        renderOrders();
        renderClients();
        renderExpenses();
        renderAchievements();
        fillSelectors();
    </script>
</body>
</html>
