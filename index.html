<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🌱 Маш Булочки — Производство</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Text', system-ui, sans-serif;
            background: linear-gradient(135deg, #F8FDF8 0%, #E8F5E9 100%);
            color: #2E7D32;
            line-height: 1.5;
            padding: 16px;
            padding-bottom: 80px;
            min-height: 100vh;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 24px;
            animation: fadeInDown 0.4s ease;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #2E7D32, #4CAF50);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }
        .date-display {
            color: #81C784;
            font-size: 14px;
            margin-top: 4px;
            font-weight: 500;
        }

        /* Navigation */
        .nav {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }
        .nav-btn {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #C8E6C9;
            padding: 12px 20px;
            border-radius: 40px;
            color: #2E7D32;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .nav-btn.active {
            background: linear-gradient(135deg, #2E7D32, #4CAF50);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(46,125,50,0.3);
        }

        /* Sections */
        .section {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .section.active {
            display: block;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            border: 1px solid #E8F5E9;
            transition: all 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(46,125,50,0.1);
        }
        .stat-number {
            font-size: 24px;
            font-weight: 800;
            color: #2E7D32;
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 11px;
            color: #81C784;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Finance Row */
        .finance-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .finance-card {
            background: linear-gradient(135deg, white, #FEFEFE);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            border: 1px solid #E8F5E9;
        }
        .finance-amount {
            font-size: 16px;
            font-weight: 700;
            color: #2E7D32;
        }
        .finance-label {
            font-size: 10px;
            color: #81C784;
        }

        /* Buttons */
        .btn {
            background: linear-gradient(135deg, #2E7D32, #4CAF50);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            margin: 8px 0;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(46,125,50,0.3);
        }
        .btn-secondary {
            background: white;
            color: #2E7D32;
            border: 1px solid #C8E6C9;
        }
        .btn-small {
            padding: 8px 16px;
            font-size: 13px;
            width: auto;
            margin: 0;
        }
        .btn-danger {
            background: linear-gradient(135deg, #EF5350, #E53935);
        }

        /* Cards */
        .card {
            background: white;
            border-radius: 20px;
            padding: 16px;
            margin: 12px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #E8F5E9;
            transition: all 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .card-title {
            font-weight: 700;
            font-size: 16px;
            color: #1B5E20;
        }

        /* Status Badges */
        .status {
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-paid { background: #C8E6C9; color: #1B5E20; }
        .status-unpaid { background: #FFEBEE; color: #C62828; }
        .status-delivered { background: #E0F2FE; color: #0369a1; }
        .status-pending { background: #FFF3E0; color: #EF6C00; }
        .status-soaking { background: #E3F2FD; color: #1976D2; }
        .status-sprouting { background: #E8F5E9; color: #2E7D32; }
        .status-peeling { background: #FFF3E0; color: #EF6C00; }
        .status-blanching { background: #FCE4EC; color: #C2185B; }
        .status-packing { background: #F3E5F5; color: #7B1FA2; }
        .status-ready { background: #C8E6C9; color: #1B5E20; }

        /* Progress Bar */
        .progress-bar {
            background: #E8F5E9;
            border-radius: 20px;
            height: 6px;
            margin: 12px 0;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, #2E7D32, #4CAF50);
            width: 0%;
            height: 100%;
            border-radius: 20px;
            transition: width 0.4s ease;
        }

        /* Tables */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 16px;
            background: white;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .data-table th {
            text-align: left;
            padding: 12px 10px;
            background: #F8FDF8;
            color: #2E7D32;
            font-weight: 600;
            border-bottom: 2px solid #E8F5E9;
        }
        .data-table td {
            padding: 10px;
            border-bottom: 1px solid #F0F4F0;
        }
        .data-table tr:hover {
            background: #FAFFFA;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 28px;
            max-width: 500px;
            margin: 40px auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-title {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #2E7D32, #4CAF50);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            transition: 0.2s;
        }
        .close-btn:hover {
            color: #2E7D32;
            transform: rotate(90deg);
        }

        /* Forms */
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #2E7D32;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #E8F5E9;
            border-radius: 16px;
            font-size: 15px;
            background: #FEFEFE;
            transition: 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76,175,80,0.2);
        }

        .flex-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #81C784;
            font-size: 14px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #E8F5E9;
            border-radius: 30px;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .task-item {
            background: linear-gradient(135deg, #F1F8E9, #E8F5E9);
            padding: 12px 16px;
            border-radius: 16px;
            margin: 8px 0;
            border-left: 4px solid #4CAF50;
            font-size: 13px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .finance-row { grid-template-columns: repeat(2, 1fr); }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .nav-btn { padding: 10px 16px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌱 Маш Булочки</h1>
        <div class="date-display" id="currentDate"></div>
    </div>

    <nav class="nav">
        <button class="nav-btn active" data-section="dashboard">📊 Главная</button>
        <button class="nav-btn" data-section="batches">📦 Партии</button>
        <button class="nav-btn" data-section="sales">💰 Продажи</button>
        <button class="nav-btn" data-section="clients">👥 Клиенты</button>
        <button class="nav-btn" data-section="expenses">💸 Расходы</button>
        <button class="nav-btn" data-section="achievements">🏆 Достижения</button>
    </nav>

    <!-- DASHBOARD -->
    <section id="dashboard" class="section active">
        <div class="stats-grid" id="mainStats"></div>
        
        <div class="finance-row" id="balanceStats"></div>
        
        <h3 style="margin: 16px 0 8px;">📋 Активные партии</h3>
        <div id="activeBatchesList"></div>
        
        <h3 style="margin: 16px 0 8px;">💰 Последние продажи</h3>
        <div id="recentSalesList"></div>
        
        <div class="flex-btns">
            <button class="btn" onclick="showModal('newBatchModal')">🎯 Добавить партию</button>
            <button class="btn btn-secondary" onclick="showModal('newSaleModal')">💰 Записать продажу</button>
        </div>
    </section>

    <!-- BATCHES -->
    <section id="batches" class="section">
        <button class="btn" onclick="showModal('newBatchModal')">🎯 Добавить партию</button>
        <div id="batchesList"></div>
    </section>

    <!-- SALES -->
    <section id="sales" class="section">
        <button class="btn" onclick="showModal('newSaleModal')">💰 Записать продажу</button>
        <div id="salesList"></div>
    </section>

    <!-- CLIENTS -->
    <section id="clients" class="section">
        <button class="btn" onclick="showModal('newClientModal')">👥 Добавить клиента</button>
        <input type="text" id="clientSearch" class="search-input" placeholder="🔍 Поиск клиента..." onkeyup="filterClients()">
        <div id="clientsList"></div>
    </section>

    <!-- EXPENSES -->
    <section id="expenses" class="section">
        <button class="btn" onclick="showModal('newExpenseModal')">💸 Добавить расход</button>
        <div id="expensesTable"></div>
    </section>

    <!-- ACHIEVEMENTS -->
    <section id="achievements" class="section">
        <button class="btn" onclick="showModal('newAchievementModal')">🏆 Добавить достижение</button>
        <div id="achievementsList"></div>
    </section>

    <!-- MODALS -->
    <div id="newBatchModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 class="modal-title">🎯 Новая партия</h3><button class="close-btn" onclick="hideModal('newBatchModal')">×</button></div>
            <form id="newBatchForm">
                <div class="form-group"><label>Номер партии:</label><input type="text" id="batchNumber" placeholder="Партия #1" required></div>
                <div class="form-group"><label>Дата начала:</label><input type="date" id="batchDate" required></div>
                <div class="form-group"><label>Время начала:</label><input type="time" id="batchTime" required></div>
                <div class="form-group"><label>Вес сухого маша (г):</label><input type="number" id="batchWeight" placeholder="500" required></div>
                <div class="form-group"><label>Статус:</label><select id="batchStatus"><option value="Замачивание">Замачивание</option><option value="Проращивание">Проращивание</option><option value="Шелушение">Шелушение</option><option value="Бланширование">Бланширование</option><option value="Сушка">Сушка</option><option value="Фасовка">Фасовка</option><option value="Готово к отправке">Готово к отправке</option></select></div>
                <div class="form-group"><label>Заметки:</label><textarea id="batchNotes" rows="2"></textarea></div>
                <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newBatchModal')">Отмена</button><button type="submit" class="btn-small">Создать</button></div>
            </form>
        </div>
    </div>

    <div id="newSaleModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 class="modal-title">💰 Новая продажа</h3><button class="close-btn" onclick="hideModal('newSaleModal')">×</button></div>
            <form id="newSaleForm">
                <div class="form-group"><label>Клиент:</label><select id="saleClient" required><option value="">Выберите клиента</option></select></div>
                <div class="form-group"><label>Дата продажи:</label><input type="date" id="saleDate" required></div>
                <div class="form-group"><label>Вес (г):</label><input type="number" id="saleWeight" placeholder="150" required></div>
                <div class="form-group"><label>Планируемая цена (руб):</label><input type="number" id="plannedPrice" placeholder="400" required></div>
                <div class="form-group"><label>Фактическая цена (руб):</label><input type="number" id="actualPrice" placeholder="600" required></div>
                <div class="form-group"><label>Статус оплаты:</label><select id="salePaymentStatus"><option value="Не оплачен">Не оплачен</option><option value="Оплачен">Оплачен</option></select></div>
                <div class="form-group"><label>Заметки:</label><textarea id="saleNotes" rows="2"></textarea></div>
                <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newSaleModal')">Отмена</button><button type="submit" class="btn-small">Записать</button></div>
            </form>
        </div>
    </div>

    <div id="newClientModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 class="modal-title">👥 Новый клиент</h3><button class="close-btn" onclick="hideModal('newClientModal')">×</button></div>
            <form id="newClientForm">
                <div class="form-group"><label>Имя клиента:</label><input type="text" id="clientName" required></div>
                <div class="form-group"><label>Место:</label><input type="text" id="clientPlace"></div>
                <div class="form-group"><label>Контакт:</label><input type="text" id="clientContact"></div>
                <div class="form-group"><label>Заметки:</label><textarea id="clientNotes" rows="2"></textarea></div>
                <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newClientModal')">Отмена</button><button type="submit" class="btn-small">Добавить</button></div>
            </form>
        </div>
    </div>

    <div id="newExpenseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 class="modal-title">💸 Новый расход</h3><button class="close-btn" onclick="hideModal('newExpenseModal')">×</button></div>
            <form id="newExpenseForm">
                <div class="form-group"><label>Дата расхода:</label><input type="date" id="expenseDate" required></div>
                <div class="form-group"><label>Наименование:</label><input type="text" id="expenseName" placeholder="Например: Пакеты для упаковки" required></div>
                <div class="form-group"><label>Сумма (руб):</label><input type="number" id="expenseAmount" placeholder="500" required></div>
                <div class="form-group"><label>Категория:</label><select id="expenseCategory"><option value="Материалы">Материалы</option><option value="Семена">Семена</option><option value="Упаковка">Упаковка</option><option value="Транспорт">Транспорт</option><option value="Прочее">Прочее</option></select></div>
                <div class="form-group"><label>Заметки:</label><textarea id="expenseNotes" rows="2" placeholder="Дополнительная информация..."></textarea></div>
                <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newExpenseModal')">Отмена</button><button type="submit" class="btn-small">Добавить расход</button></div>
            </form>
        </div>
    </div>

    <div id="editExpenseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 class="modal-title">✏️ Редактировать расход</h3><button class="close-btn" onclick="hideModal('editExpenseModal')">×</button></div>
            <form id="editExpenseForm">
                <input type="hidden" id="editExpenseId">
                <div class="form-group"><label>Дата расхода:</label><input type="date" id="editExpenseDate" required></div>
                <div class="form-group"><label>Наименование:</label><input type="text" id="editExpenseName" required></div>
                <div class="form-group"><label>Сумма (руб):</label><input type="number" id="editExpenseAmount" required></div>
                <div class="form-group"><label>Категория:</label><select id="editExpenseCategory"><option value="Материалы">Материалы</option><option value="Семена">Семена</option><option value="Упаковка">Упаковка</option><option value="Транспорт">Транспорт</option><option value="Прочее">Прочее</option></select></div>
                <div class="form-group"><label>Заметки:</label><textarea id="editExpenseNotes" rows="2"></textarea></div>
                <div class="flex-btns"><button type="button" class="btn-danger btn-small" onclick="deleteExpenseFromModal()">🗑️ Удалить</button><button type="button" class="btn-secondary btn-small" onclick="hideModal('editExpenseModal')">Отмена</button><button type="submit" class="btn-small">💾 Сохранить</button></div>
            </form>
        </div>
    </div>

    <div id="newAchievementModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 class="modal-title">🏆 Новое достижение</h3><button class="close-btn" onclick="hideModal('newAchievementModal')">×</button></div>
            <form id="newAchievementForm">
                <div class="form-group"><label>Дата достижения:</label><input type="date" id="achievementDate" required></div>
                <div class="form-group"><label>Описание:</label><input type="text" id="achievementDesc" placeholder="Например: Побил рекорд по производству!" required></div>
                <div class="form-group"><label>Категория:</label><select id="achievementCategory"><option value="Производство">Производство</option><option value="Продажи">Продажи</option><option value="Клиенты">Клиенты</option></select></div>
                <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newAchievementModal')">Отмена</button><button type="submit" class="btn-small">Добавить</button></div>
            </form>
        </div>
    </div>

    <div id="editSaleModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 class="modal-title">✏️ Редактировать продажу</h3><button class="close-btn" onclick="hideModal('editSaleModal')">×</button></div>
            <form id="editSaleForm">
                <input type="hidden" id="editSaleId">
                <div class="form-group"><label>Клиент:</label><select id="editSaleClient" required></select></div>
                <div class="form-group"><label>Дата продажи:</label><input type="date" id="editSaleDate" required></div>
                <div class="form-group"><label>Вес (г):</label><input type="number" id="editSaleWeight" required></div>
                <div class="form-group"><label>Планируемая цена:</label><input type="number" id="editPlannedPrice" required></div>
                <div class="form-group"><label>Фактическая цена:</label><input type="number" id="editActualPrice" required></div>
                <div class="form-group"><label>Статус оплаты:</label><select id="editSalePaymentStatus"><option value="Не оплачен">Не оплачен</option><option value="Оплачен">Оплачен</option></select></div>
                <div class="form-group"><label>Заметки:</label><textarea id="editSaleNotes" rows="2"></textarea></div>
                <div class="flex-btns"><button type="button" class="btn-danger btn-small" onclick="deleteSaleFromModal()">🗑️ Удалить</button><button type="button" class="btn-secondary btn-small" onclick="hideModal('editSaleModal')">Отмена</button><button type="submit" class="btn-small">💾 Сохранить</button></div>
            </form>
        </div>
    </div>

    <div id="editBatchModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 class="modal-title">✏️ Редактировать партию</h3><button class="close-btn" onclick="hideModal('editBatchModal')">×</button></div>
            <form id="editBatchForm">
                <input type="hidden" id="editBatchId">
                <div class="form-group"><label>Номер партии:</label><input type="text" id="editBatchNumber" required></div>
                <div class="form-group"><label>Дата начала:</label><input type="date" id="editBatchDate" required></div>
                <div class="form-group"><label>Время начала:</label><input type="time" id="editBatchTime" required></div>
                <div class="form-group"><label>Вес сухого маша (г):</label><input type="number" id="editBatchWeight" required></div>

                    { id: 2, date: "2025-12-20", name: "Весы", amount: 300, category: "Материалы", notes: "Со скидкой", createdAt: new Date().toISOString() },

                    { id: 2, date: "2025-12-07", description: "Сегодня ЯМАНАСИ заказали еще 200г. И я сделала за месяц 6 тысяч рублей!!!", category: "Продажи", createdAt: new Date().toISOString() },

        initData();
        
        // ==================== ФИНАНСОВЫЕ РАСЧЕТЫ ====================
        function getFinancialStats() {
            const sales = DB.load('sales_new');
            const expenses = DB.load('expenses_new');
            const today = new Date().toISOString().slice(0,10);
            const weekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString().slice(0,10);
            const monthAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString().slice(0,10);
            const yearStart = "2026-03-01";
            
            // Доходы (только оплаченные продажи)
            const paidSales = sales.filter(s => s.paymentStatus === "Оплачен");
            const totalIncome = paidSales.reduce((sum, s) => sum + s.actualPrice, 0);
            
            // Расходы
            const totalExpenses = expenses.reduce((sum, e) => sum + e.amount, 0);
            const currentBalance = totalIncome - totalExpenses;
            
            // За сегодня
            const todayIncome = paidSales.filter(s => s.date === today).reduce((sum, s) => sum + s.actualPrice, 0);
            const todayExpenses = expenses.filter(e => e.date === today).reduce((sum, e) => sum + e.amount, 0);
            const todayBalance = todayIncome - todayExpenses;
            
            // За неделю
            const weekIncome = paidSales.filter(s => s.date >= weekAgo).reduce((sum, s) => sum + s.actualPrice, 0);
            const weekExpenses = expenses.filter(e => e.date >= weekAgo).reduce((sum, e) => sum + e.amount, 0);
            const weekBalance = weekIncome - weekExpenses;
            
            // За месяц
            const monthIncome = paidSales.filter(s => s.date >= monthAgo).reduce((sum, s) => sum + s.actualPrice, 0);
            const monthExpenses = expenses.filter(e => e.date >= monthAgo).reduce((sum, e) => sum + e.amount, 0);
            const monthBalance = monthIncome - monthExpenses;
            
            // За год (с 1 марта)
            const yearIncome = paidSales.filter(s => s.date >= yearStart).reduce((sum, s) => sum + s.actualPrice, 0);
            const yearExpenses = expenses.filter(e => e.date >= yearStart).reduce((sum, e) => sum + e.amount, 0);
            const yearBalance = yearIncome - yearExpenses;
            
            return {
                totalIncome, totalExpenses, currentBalance,
                todayBalance, weekBalance, monthBalance, yearBalance,
                todayIncome, weekIncome, monthIncome, yearIncome,
                todayExpenses, weekExpenses, monthExpenses, yearExpenses
            };
        }
        
        function getStatusClass(status) {
            const map = {
                'Замачивание': 'soaking',
                'Проращивание': 'sprouting',
                'Шелушение': 'peeling',
                'Бланширование': 'blanching',
                'Сушка': 'packing',
                'Фасовка': 'packing',
                'Готово к отправке': 'ready'
            };
            return map[status] || 'sprouting';
        }
        
        function getProgressPercent(status) {
            const stages = ['Замачивание', 'Проращивание', 'Шелушение', 'Бланширование', 'Сушка', 'Фасовка', 'Готово к отправке'];
            const index = stages.indexOf(status);
            return ((index + 1) / stages.length) * 100;
        }
        
        // ==================== РЕНДЕР ДАШБОРДА ====================
        function renderDashboard() {
            const batches = DB.load('batches_new');
            const sales = DB.load('sales_new');
            const clients = DB.load('clients_new');
            const finances = getFinancialStats();
            
            // Основные статистики
            document.getElementById('mainStats').innerHTML = `
                <div class="stat-card"><div class="stat-number">${batches.length}</div><div class="stat-label">Всего партий</div></div>
                <div class="stat-card"><div class="stat-number">${finances.totalIncome}₽</div><div class="stat-label">Общая выручка</div></div>
                <div class="stat-card"><div class="stat-number">${batches.filter(b => b.status !== 'Готово к отправке').length}</div><div class="stat-label">Активные</div></div>
                <div class="stat-card"><div class="stat-number">${clients.length}</div><div class="stat-label">Клиенты</div></div>
            `;
            
            // Финансовые показатели
            document.getElementById('balanceStats').innerHTML = `
                <div class="finance-card"><div class="finance-amount">${finances.currentBalance}₽</div><div class="finance-label">Текущий баланс</div></div>
                <div class="finance-card"><div class="finance-amount">${finances.todayBalance}₽</div><div class="finance-label">За сегодня</div></div>
                <div class="finance-card"><div class="finance-amount">${finances.weekBalance}₽</div><div class="finance-label">За неделю</div></div>
                <div class="finance-card"><div class="finance-amount">${finances.monthBalance}₽</div><div class="finance-label">За месяц</div></div>
                <div class="finance-card"><div class="finance-amount">${finances.yearBalance}₽</div><div class="finance-label">С 1 марта</div></div>
                <div class="finance-card"><div class="finance-amount">${finances.totalIncome - finances.totalExpenses}₽</div><div class="finance-label">Общая прибыль</div></div>
            `;
            
            // Активные партии
            const activeBatches = batches.filter(b => b.status !== 'Готово к отправке').slice(0, 3);
            const activeDiv = document.getElementById('activeBatchesList');
            if (activeBatches.length === 0) {
                activeDiv.innerHTML = '<div class="empty-state">Нет активных партий</div>';
            } else {
                activeDiv.innerHTML = activeBatches.map(batch => `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">${batch.batchNumber}</div>
                            <div class="status status-${getStatusClass(batch.status)}">${batch.status}</div>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" style="width:${getProgressPercent(batch.status)}%"></div></div>
                        <div class="card-details">📦 ${batch.dryWeight}г • 📅 ${batch.date} • 🕒 ${batch.time}</div>
                        ${batch.notes ? `<div class="card-details">📝 ${batch.notes}</div>` : ''}
                        <div class="flex-btns"><button class="btn-small btn-secondary" onclick="editBatch(${batch.id})">✏️ Редактировать</button></div>
                    </div>
                `).join('');
            }
            
            // Последние продажи
            const recentSales = sales.slice(-3).reverse();
            const recentDiv = document.getElementById('recentSalesList');
            if (recentSales.length === 0) {
                recentDiv.innerHTML = '<div class="empty-state">Нет продаж</div>';
            } else {
                recentDiv.innerHTML = recentSales.map(sale => `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">${sale.clientName}</div>
                            <div class="status ${sale.paymentStatus === 'Оплачен' ? 'status-paid' : 'status-unpaid'}">${sale.paymentStatus}</div>
                        </div>
                        <div class="card-details">📦 ${sale.weight}г • 💰 ${sale.actualPrice}₽ (план: ${sale.plannedPrice}₽) • 📅 ${sale.date}</div>
                        ${sale.notes ? `<div class="card-details">📝 ${sale.notes}</div>` : ''}
                        <div class="flex-btns"><button class="btn-small btn-secondary" onclick="editSale(${sale.id})">✏️ Редактировать</button></div>
                    </div>
                `).join('');
            }
        }
        
        // ==================== ПАРТИИ ====================
        function renderBatches() {
            const batches = DB.load('batches_new');
            const div = document.getElementById('batchesList');
            if (batches.length === 0) {
                div.innerHTML = '<div class="empty-state">Нет созданных партий</div>';
                return;
            }
            const sorted = batches.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            div.innerHTML = sorted.map(batch => `
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">${batch.batchNumber}</div>
                        <div class="status status-${getStatusClass(batch.status)}">${batch.status}</div>

                    <div class="progress-bar"><div class="progress-fill" style="width:${getProgressPercent(batch.status)}%"></div></div>
                    <div class="card-details">📦 ${batch.dryWeight}г • 📅 ${batch.date} • 🕒 ${batch.time}</div>
                    ${batch.notes ? `<div class="card-details">📝 ${batch.notes}</div>` : ''}

                </div>
            `).join('');

        window.editBatch = (id) => {

                let batches = DB.load('batches_new');

                DB.save('batches_new', batches);
                hideModal('editBatchModal');
                renderBatches();
                renderDashboard();

        };
        
        // ==================== ПРОДАЖИ ====================
        function renderSales() {
            const sales = DB.load('sales_new');
            const div = document.getElementById('salesList');
            if (sales.length === 0) {
                div.innerHTML = '<div class="empty-state">Нет записанных продаж</div>';

                </div>

        window.editSale = (id) => {
            const sales = DB.load('sales_new');
            const clients = DB.load('clients_new');

            if (sale) {
                document.getElementById('editSaleId').value = sale.id;

        // ==================== КЛИЕНТЫ ====================

                return `

                </div>
            `;
            
            if (expenses.length === 0) {
                div.innerHTML = expensesHeader + '<div class="empty-state">Нет расходов</div>';
                return;
            }
            
            const sorted = expenses.sort((a, b) => new Date(b.date) - new Date(a.date));
            div.innerHTML = expensesHeader + `
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead><tr><th>Дата</th><th>Наименование</th><th>Категория</th><th>Сумма</th><th></th></tr></thead>
                        <tbody>
                            ${sorted.map(e => `
                                <tr>
                                    <td>${e.date}</td>
                                    <td>${e.name}</td>
                                    <td><span class="status status-pending" style="background:#F3E5F5">${e.category}</span></td>
                                    <td><b>-${e.amount}₽</b></td>
                                    <td><button class="btn-icon btn-small" onclick="editExpense(${e.id})">✏️</button></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }
        
        window.editExpense = (id) => {
            const expenses = DB.load('expenses_new');
            const expense = expenses.find(e => e.id === id);
            if (expense) {
                document.getElementById('editExpenseId').value = expense.id;
                document.getElementById('editExpenseDate').value = expense.date;
                document.getElementById('editExpenseName').value = expense.name;
                document.getElementById('editExpenseAmount').value = expense.amount;
                document.getElementById('editExpenseCategory').value = expense.category;
                document.getElementById('editExpenseNotes').value = expense.notes || '';
                showModal('editExpenseModal');
            }
        };
        
        window.deleteExpenseFromModal = () => {
            const id = parseInt(document.getElementById('editExpenseId').value);
            if (confirm('Удалить этот расход?')) {
                let expenses = DB.load('expenses_new');
                expenses = expenses.filter(e => e.id !== id);
                DB.save('expenses_new', expenses);
                hideModal('editExpenseModal');
                renderExpenses();
                renderDashboard();
            }
        };
        
        // ==================== ДОСТИЖЕНИЯ ====================
        function renderAchievements() {
            const achievements = DB.load('achievements_new');
            const div = document.getElementById('achievementsList');
            if (achievements.length === 0) {
                div.innerHTML = '<div class="empty-state">Нет достижений. Добавьте первое!</div>';
                return;
            }
            const sorted = achievements.sort((a, b) => new Date(b.date) - new Date(a.date));
            div.innerHTML = sorted.map(a => `
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">🏆 ${a.description}</div>
                        <button class="btn-icon btn-small" onclick="deleteAchievement(${a.id})" style="color:#E53935">🗑️</button>
                    </div>
                    <div class="card-details">📅 ${a.date} • ${a.category}</div>
                </div>
            `).join('');
        }
        
        window.deleteAchievement = (id) => {
            if (confirm('Удалить достижение?')) {
                let achievements = DB.load('achievements_new');
                achievements = achievements.filter(a => a.id !== id);
                DB.save('achievements_new', achievements);
                renderAchievements();
            }
        };
        
        // ==================== ФОРМЫ ====================
        function fillSelectors() {
            const clients = DB.load('clients_new');
            const clientSelect = document.getElementById('saleClient');
            const editClientSelect = document.getElementById('editSaleClient');
            if (clientSelect) clientSelect.innerHTML = '<option value="">Выберите клиента</option>' + clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            if (editClientSelect) editClientSelect.innerHTML = clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }
        
        document.getElementById('newBatchForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const batches = DB.load('batches_new');
            batches.push({
                id: DB.getNextId('batches_new'),
                batchNumber: document.getElementById('batchNumber').value,
                date: document.getElementById('batchDate').value,
                time: document.getElementById('batchTime').value,
                dryWeight: parseInt(document.getElementById('batchWeight').value),
                status: document.getElementById('batchStatus').value,
                notes: document.getElementById('batchNotes').value,
                createdAt: new Date().toISOString()
            });
            DB.save('batches_new', batches);
            hideModal('newBatchModal');
            document.getElementById('newBatchForm').reset();
            renderBatches();
            renderDashboard();
        });
        
        document.getElementById('editBatchForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = parseInt(document.getElementById('editBatchId').value);
            let batches = DB.load('batches_new');
            const index = batches.findIndex(b => b.id === id);
            if (index !== -1) {
                batches[index] = {
                    ...batches[index],
                    batchNumber: document.getElementById('editBatchNumber').value,
                    date: document.getElementById('editBatchDate').value,
                    time: document.getElementById('editBatchTime').value,
                    dryWeight: parseInt(document.getElementById('editBatchWeight').value),
                    status: document.getElementById('editBatchStatus').value,
                    notes: document.getElementById('editBatchNotes').value
                };
                DB.save('batches_new', batches);
                hideModal('editBatchModal');
                renderBatches();
                renderDashboard();
            }
        });
        
        document.getElementById('newSaleForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const clientId = parseInt(document.getElementById('saleClient').value);
            const clients = DB.load('clients_new');
            const client = clients.find(c => c.id === clientId);
            if (!client) { alert('Выберите клиента!'); return; }
            const sales = DB.load('sales_new');
            sales.push({
                id: DB.getNextId('sales_new'),
                clientId: clientId,
                clientName: client.name,
                date: document.getElementById('saleDate').value,
                weight: parseInt(document.getElementById('saleWeight').value),
                plannedPrice: parseInt(document.getElementById('plannedPrice').value),
                actualPrice: parseInt(document.getElementById('actualPrice').value),
                paymentStatus: document.getElementById('salePaymentStatus').value,
                notes: document.getElementById('saleNotes').value,
                createdAt: new Date().toISOString()
            });
            DB.save('sales_new', sales);
            hideModal('newSaleModal');
            document.getElementById('newSaleForm').reset();
            renderSales();
            renderDashboard();
        });
        
        document.getElementById('editSaleForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = parseInt(document.getElementById('editSaleId').value);
            const clientId = parseInt(document.getElementById('editSaleClient').value);
            const clients = DB.load('clients_new');
            const client = clients.find(c => c.id === clientId);
            let sales = DB.load('sales_new');
            const index = sales.findIndex(s => s.id === id);
            if (index !== -1) {
                sales[index] = {
                    ...sales[index],
                    clientId: clientId,
                    clientName: client.name,
                    date: document.getElementById('editSaleDate').value,
                    weight: parseInt(document.getElementById('editSaleWeight').value),
                    plannedPrice: parseInt(document.getElementById('editPlannedPrice').value),
                    actualPrice: parseInt(document.getElementById('editActualPrice').value),
                    paymentStatus: document.getElementById('editSalePaymentStatus').value,
                    notes: document.getElementById('editSaleNotes').value
                };
                DB.save('sales_new', sales);
                hideModal('editSaleModal');
                renderSales();
                renderDashboard();
            }
        });
        
        document.getElementById('newClientForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const clients = DB.load('clients_new');
            clients.push({
                id: DB.getNextId('clients_new'),
                name: document.getElementById('clientName').value,
                place: document.getElementById('clientPlace').value,
                contact: document.getElementById('clientContact').value,
                notes: document.getElementById('clientNotes').value,
                createdAt: new Date().toISOString()
            });
            DB.save('clients_new', clients);
            hideModal('newClientModal');
            document.getElementById('newClientForm').reset();
            renderClients();
            fillSelectors();
        });
        
        document.getElementById('newExpenseForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const expenses = DB.load('expenses_new');
            expenses.push({
                id: DB.getNextId('expenses_new'),
                date: document.getElementById('expenseDate').value,
                name: document.getElementById('expenseName').value,
                amount: parseInt(document.getElementById('expenseAmount').value),
                category: document.getElementById('expenseCategory').value,
                notes: document.getElementById('expenseNotes').value,
                createdAt: new Date().toISOString()
            });
            DB.save('expenses_new', expenses);
            hideModal('newExpenseModal');
            document.getElementById('newExpenseForm').reset();
            renderExpenses();
            renderDashboard();
        });
        
        document.getElementById('editExpenseForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = parseInt(document.getElementById('editExpenseId').value);
            let expenses = DB.load('expenses_new');
            const index = expenses.findIndex(e => e.id === id);
            if (index !== -1) {
                expenses[index] = {
                    ...expenses[index],
                    date: document.getElementById('editExpenseDate').value,
                    name: document.getElementById('editExpenseName').value,
                    amount: parseInt(document.getElementById('editExpenseAmount').value),
                    category: document.getElementById('editExpenseCategory').value,
                    notes: document.getElementById('editExpenseNotes').value
                };
                DB.save('expenses_new', expenses);
                hideModal('editExpenseModal');
                renderExpenses();
                renderDashboard();
            }
        });
        
        document.getElementById('newAchievementForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const achievements = DB.load('achievements_new');
            achievements.push({
                id: DB.getNextId('achievements_new'),
                date: document.getElementById('achievementDate').value,
                description: document.getElementById('achievementDesc').value,
                category: document.getElementById('achievementCategory').value,
                createdAt: new Date().toISOString()
            });
            DB.save('achievements_new', achievements);
            hideModal('newAchievementModal');
            document.getElementById('newAchievementForm').reset();
            renderAchievements();
        });
        
        // ==================== НАВИГАЦИЯ ====================
        window.showModal = (id) => { fillSelectors(); document.getElementById(id).style.display = 'block'; };
        window.hideModal = (id) => document.getElementById(id).style.display = 'none';
        
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                this.classList.add('active');
                const section = this.getAttribute('data-section');
                document.getElementById(section).classList.add('active');
                if (section === 'dashboard') renderDashboard();
                if (section === 'batches') renderBatches();
                if (section === 'sales') renderSales();
                if (section === 'clients') renderClients();
                if (section === 'expenses') renderExpenses();
                if (section === 'achievements') renderAchievements();
            });
        });
        
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
        
        // Стартовый рендер
        renderDashboard();
        renderBatches();
        renderSales();
        renderClients();
        renderExpenses();
        renderAchievements();
        fillSelectors();
    </script>
</body>
</html>
