<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>🌱 VITARAY</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F5FBF5;
            color: #1A3A1A;
            padding: 0 12px 80px;
        }
        .header {
            background: linear-gradient(135deg, #2E7D32, #4CAF50);
            margin: 0 -12px 16px -12px;
            padding: 20px 16px;
            border-radius: 0 0 28px 28px;
            color: white;
        }
        .header h1 { font-size: 24px; }
        .date-display { font-size: 13px; opacity: 0.9; margin-top: 6px; }
        .nav { display: flex; gap: 6px; margin-bottom: 20px; overflow-x: auto; }
        .nav-btn {
            background: white; border: none; padding: 8px 14px; border-radius: 40px;
            font-size: 12px; font-weight: 600; color: #2E7D32; cursor: pointer;
        }
        .nav-btn.active { background: #2E7D32; color: white; }
        .section { display: none; }
        .section.active { display: block; }
        .card {
            background: white; border-radius: 20px; padding: 14px; margin-bottom: 12px;
            border: 1px solid #E8F5E9;
        }
        .card-header { display: flex; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
        .card-title { font-weight: 700; font-size: 15px; }
        .card-details { font-size: 12px; color: #666; margin: 4px 0; }
        .progress-bar { background: #E8F5E9; border-radius: 20px; height: 6px; margin: 8px 0; overflow: hidden; }
        .progress-fill { background: #2E7D32; width: 0%; height: 100%; }
        .status { padding: 3px 8px; border-radius: 30px; font-size: 9px; font-weight: 600; display: inline-block; }
        .status-paid { background: #C8E6C9; color: #1B5E20; }
        .status-unpaid { background: #FFEBEE; color: #C62828; }
        .status-delivered { background: #E0F2FE; color: #0369a1; }
        .status-pending { background: #FFF3E0; color: #EF6C00; }
        .btn {
            background: #2E7D32; color: white; border: none; padding: 12px;
            border-radius: 40px; font-size: 14px; font-weight: 600; width: 100%; cursor: pointer; margin: 6px 0;
        }
        .btn-secondary { background: white; color: #2E7D32; border: 1px solid #C8E6C9; }
        .btn-small { padding: 5px 10px; font-size: 10px; width: auto; margin: 0; }
        .btn-danger { background: #FFEBEE; color: #C62828; border: 1px solid #FFCDD2; }
        .flex-btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .stats-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .stat-card { background: white; border-radius: 16px; padding: 10px; text-align: center; flex: 1; }
        .stat-number { font-size: 18px; font-weight: 800; color: #2E7D32; }
        .balance-card { background: #2E7D32; border-radius: 16px; padding: 10px; text-align: center; margin-bottom: 12px; color: white; }
        .balance-amount { font-size: 20px; font-weight: 800; }
        .plans-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
        .plan-tab { background: white; border: 1px solid #E8F5E9; padding: 6px 12px; border-radius: 30px; font-size: 12px; cursor: pointer; }
        .plan-tab.active { background: #2E7D32; color: white; }
        .plan-section { background: #F0F7F0; border-radius: 16px; padding: 12px; margin-bottom: 12px; }
        .plan-time { font-weight: 700; font-size: 12px; margin: 8px 0 6px; color: #2E7D32; }
        .task-item { background: white; border-radius: 12px; padding: 8px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .task-checkbox { width: 18px; height: 18px; }
        .task-text { flex: 1; font-size: 12px; }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; padding: 20px; overflow-y: auto;
        }
        .modal-content {
            background: white; border-radius: 24px; padding: 20px; max-width: 500px; margin: 40px auto;
        }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 16px; }
        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 4px; color: #2E7D32; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #E8F5E9; border-radius: 12px; font-size: 13px; }
        .empty-state { text-align: center; padding: 30px; color: #81C784; }
        .total-amount { font-weight: 700; text-align: right; margin-top: 8px; padding-top: 6px; border-top: 1px solid #E8F5E9; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌱 VITARAY</h1>
        <div class="date-display" id="currentDate"></div>
    </div>

    <div class="nav">
        <button class="nav-btn active" data-section="dashboard">🏠 Главная</button>
        <button class="nav-btn" data-section="parties">🌱 Партии</button>
        <button class="nav-btn" data-section="orders">📦 Заказы</button>
        <button class="nav-btn" data-section="sales">💰 Продажи</button>
        <button class="nav-btn" data-section="clients">👥 Клиенты</button>
        <button class="nav-btn" data-section="expenses">💸 Расходы</button>
        <button class="nav-btn" data-section="achievements">🏆 Достижения</button>
        <button class="nav-btn" data-section="library">📚 Библиотека</button>
    </div>

    <section id="dashboard" class="section active">
        <div class="stats-row" id="incomeStats"></div>
        <div class="balance-card"><div class="balance-amount" id="currentBalance">0₽</div><div>Баланс</div></div>
        <div class="stats-row"><div class="stat-card"><div class="stat-number" id="totalIncome">0₽</div><div>Доход</div></div><div class="stat-card"><div class="stat-number" id="totalExpenses">0₽</div><div>Расход</div></div></div>
        
        <div class="plans-tabs">
            <button class="plan-tab active" data-plan="today">Сегодня</button>
            <button class="plan-tab" data-plan="tomorrow">Завтра</button>
        </div>
        <div id="plansContainer"></div>
        
        <h3 style="font-size:13px;">Активные партии</h3>
        <div id="activePartiesList"></div>
        
        <div class="flex-btns">
            <button class="btn" onclick="showModal('newPartyModal')">➕ Новая партия</button>
            <button class="btn btn-secondary" onclick="showModal('newOrderModal')">📦 Новый заказ</button>
            <button class="btn btn-secondary" onclick="showModal('newSaleModal')">💰 Новая продажа</button>
        </div>
    </section>

    <section id="parties" class="section"><button class="btn" onclick="showModal('newPartyModal')">Создать партию</button><div id="partiesList"></div></section>
    <section id="orders" class="section"><button class="btn" onclick="showModal('newOrderModal')">Создать заказ</button><div id="ordersList"></div></section>
    <section id="sales" class="section"><button class="btn" onclick="showModal('newSaleModal')">Записать продажу</button><div id="salesList"></div></section>
    <section id="clients" class="section"><button class="btn" onclick="showModal('newClientModal')">Добавить клиента</button><input type="text" id="clientSearch" class="search-input" placeholder="Поиск..." onkeyup="filterClients()"><div id="clientsList"></div></section>
    <section id="expenses" class="section"><button class="btn" onclick="showModal('newExpenseModal')">Добавить расход</button><div id="expensesList"></div></section>
    <section id="achievements" class="section"><button class="btn" onclick="showModal('newAchievementModal')">Добавить достижение</button><div id="achievementsList"></div></section>
    <section id="library" class="section"><div id="culturesList"></div></section>

    <!-- Модальные окна -->
    <div id="newPartyModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>Новая партия</h3><button class="close-btn" onclick="hideModal('newPartyModal')">×</button></div>
    <form id="newPartyForm"><div class="form-group"><label>Культура</label><select id="partyCulture"></select></div>
    <div class="form-group"><label>Вес (г)</label><input type="number" id="partyWeight" required></div>
    <div class="form-group"><label>Дата посева</label><input type="date" id="partyDate" required></div>
    <div class="form-group"><label>Контейнер</label><select id="partyContainer"><option>15x11</option><option>8x5</option></select></div>
    <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newPartyModal')">Отмена</button><button type="submit" class="btn-small">Создать</button></div></form></div></div>

    <div id="newOrderModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>Новый заказ</h3><button class="close-btn" onclick="hideModal('newOrderModal')">×</button></div>
    <form id="newOrderForm"><div class="form-group"><label>Клиент</label><select id="orderClient"></select></div>
    <div class="form-group"><label>Дата</label><input type="date" id="orderDate" required></div>
    <div class="form-group"><label>Культура</label><select id="orderCulture"></select></div>
    <div class="form-group"><label>Вес (г)</label><input type="number" id="orderWeight" required></div>
    <div class="form-group"><label>Цена (₽)</label><input type="number" id="orderPrice" required></div>
    <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newOrderModal')">Отмена</button><button type="submit" class="btn-small">Создать</button></div></form></div></div>

    <div id="newSaleModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>Новая продажа</h3><button class="close-btn" onclick="hideModal('newSaleModal')">×</button></div>
    <form id="newSaleForm"><div class="form-group"><label>Клиент</label><select id="saleClient"></select></div>
    <div class="form-group"><label>Дата</label><input type="date" id="saleDate" required></div>
    <div class="form-group"><label>Культура</label><select id="saleCulture"></select></div>
    <div class="form-group"><label>Вес (г)</label><input type="number" id="saleWeight" required></div>
    <div class="form-group"><label>Сумма (₽)</label><input type="number" id="saleAmount" required></div>
    <div class="form-group"><label>Оплачено</label><select id="salePaid"><option value="true">Да</option><option value="false">Нет</option></select></div>
    <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newSaleModal')">Отмена</button><button type="submit" class="btn-small">Записать</button></div></form></div></div>

    <div id="newClientModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>Новый клиент</h3><button class="close-btn" onclick="hideModal('newClientModal')">×</button></div>
    <form id="newClientForm"><div class="form-group"><label>Имя</label><input type="text" id="clientName" required></div>
    <div class="form-group"><label>Место</label><input type="text" id="clientPlace"></div>
    <div class="form-group"><label>Контакт</label><input type="text" id="clientContact"></div>
    <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newClientModal')">Отмена</button><button type="submit" class="btn-small">Добавить</button></div></form></div></div>

    <div id="newExpenseModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>Новый расход</h3><button class="close-btn" onclick="hideModal('newExpenseModal')">×</button></div>
    <form id="newExpenseForm"><div class="form-group"><label>Дата</label><input type="date" id="expenseDate" required></div>
    <div class="form-group"><label>Категория</label><select id="expenseCategory"><option>Семена</option><option>Контейнеры</option><option>Субстрат</option><option>Оборудование</option></select></div>
    <div class="form-group"><label>Наименование</label><input type="text" id="expenseName" required></div>
    <div class="form-group"><label>Сумма (₽)</label><input type="number" id="expenseAmount" required></div>
    <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newExpenseModal')">Отмена</button><button type="submit" class="btn-small">Добавить</button></div></form></div></div>

    <div id="newAchievementModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>Новое достижение</h3><button class="close-btn" onclick="hideModal('newAchievementModal')">×</button></div>
    <form id="newAchievementForm"><div class="form-group"><label>Дата</label><input type="date" id="achievementDate" required></div>
    <div class="form-group"><label>Описание</label><input type="text" id="achievementDesc" required></div>
    <div class="form-group"><label>Категория</label><select id="achievementCategory"><option>Продажи</option><option>Производство</option><option>Клиенты</option></select></div>
    <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newAchievementModal')">Отмена</button><button type="submit" class="btn-small">Добавить</button></div></form></div></div>

    <script>
        // ==================== ДАННЫЕ ====================
        let parties = [];
        let orders = [];
        let sales = [];
        let expenses = [];
        let achievements = [
            {id:'a1',date:'2025-11-06',description:'Рождение бизнес-идеи по производству маша',category:'Производство'},
            {id:'a2',date:'2025-11-07',description:'Приобрела первый маш',category:'Производство'},
            {id:'a3',date:'2025-11-29',description:'Написала ресторану и отдала пробную порцию',category:'Продажи'},
            {id:'a4',date:'2025-12-07',description:'ЯМАНАСИ заказали еще 200г. 6 тысяч за месяц!',category:'Продажи'},
            {id:'a5',date:'2025-12-11',description:'Придумала идею! Буду делать готовые чипсы!',category:'Производство'}
        ];
        
        let clients = [
            {id:'c1',name:'ЯМАНАСИ',place:'Ул красных Партизан 1/4к9',contact:'Анатолий'},
            {id:'c2',name:'Казарян',place:'МОН',contact:'305'},{id:'c3',name:'Денисова',place:'МОН',contact:'305'},
            {id:'c4',name:'Терещенко',place:'МОН',contact:'305'},{id:'c5',name:'Наташа',place:'МОН',contact:'403'},
            {id:'c6',name:'Валерия',place:'МОН',contact:'303'},{id:'c7',name:'Настена',place:'МОН',contact:'406'},
            {id:'c8',name:'Ежкин кот',place:'КП 1/4к9',contact:'+7 989 228 4153'},{id:'c9',name:'Карибова',place:'МОН',contact:'315'},
            {id:'c10',name:'Савченко',place:'МОН',contact:'311'},{id:'c11',name:'Кирьян Света',place:'МОН',contact:'304'},
            {id:'c12',name:'Рыбина',place:'МОН',contact:'404'},{id:'c13',name:'Журавлева',place:'МОН',contact:'404'},
            {id:'c14',name:'Тоня',place:'МОН',contact:'403'},{id:'c15',name:'Екатерина',place:'Дальний проезд 3',contact:'89182860856'}
        ];
        
        let cultures = {
            "горох":{type:"microgreen",norm15:25,norm8:4,daysToReady:10},
            "редис":{type:"microgreen",norm15:4,norm8:2,daysToReady:8},
            "маш":{type:"sprouts",norm15:25,norm8:4,daysToReady:6},
            "нут":{type:"sprouts",norm15:30,norm8:5,daysToReady:5},
            "соя":{type:"sprouts",norm15:30,norm8:5,daysToReady:6}
        };
        
        let defaultSales = [
            {id:'s1',clientId:'c1',date:'2026-03-20',culture:'маш',weight:1170,amount:1170,paid:true},
            {id:'s2',clientId:'c2',date:'2026-03-17',culture:'маш',weight:150,amount:150,paid:true}
        ];

        function loadData() {
            let p = localStorage.getItem('vitaray_parties'); if(p) parties = JSON.parse(p);
            let o = localStorage.getItem('vitaray_orders'); if(o) orders = JSON.parse(o);
            let s = localStorage.getItem('vitaray_sales'); if(s) sales = JSON.parse(s);
            let c = localStorage.getItem('vitaray_clients'); if(c) clients = JSON.parse(c);
            let e = localStorage.getItem('vitaray_expenses'); if(e) expenses = JSON.parse(e);
            let a = localStorage.getItem('vitaray_achievements'); if(a) achievements = JSON.parse(a);
            if(sales.length === 0) sales = defaultSales;
            saveData();
        }
        function saveData() {
            localStorage.setItem('vitaray_parties', JSON.stringify(parties));
            localStorage.setItem('vitaray_orders', JSON.stringify(orders));
            localStorage.setItem('vitaray_sales', JSON.stringify(sales));
            localStorage.setItem('vitaray_clients', JSON.stringify(clients));
            localStorage.setItem('vitaray_expenses', JSON.stringify(expenses));
            localStorage.setItem('vitaray_achievements', JSON.stringify(achievements));
        }

        function getClientName(id) { let c = clients.find(c => c.id === id); return c ? c.name : 'Клиент'; }
        function getStageName(s) { let n = {zomachivanie:'Замачивание',posev:'Посев',v_temi:'В тени',pod_lampoy:'Под лампой',srezka:'Срезка',sbor:'Сбор'}; return n[s] || s; }
        function getStages(c) { return cultures[c]?.type === 'microgreen' ? ['zomachivanie','posev','v_temi','pod_lampoy','srezka'] : ['zomachivanie','posev','sbor']; }
        function getProgress(p) { let s = getStages(p.culture); let i = s.indexOf(p.currentStage); return ((i+1)/s.length)*100; }
        
        function getFinancialStats() {
            let paid = sales.filter(s => s.paid).reduce((s,i) => s + i.amount, 0);
            let exp = expenses.reduce((s,e) => s + e.amount, 0);
            let today = new Date().toISOString().slice(0,10);
            let week = new Date(Date.now() - 7*86400000).toISOString().slice(0,10);
            return {
                totalIncome: paid, totalExpenses: exp, currentBalance: paid - exp,
                dayIncome: sales.filter(s => s.paid && s.date === today).reduce((s,i) => s + i.amount, 0),
                weekIncome: sales.filter(s => s.paid && s.date >= week).reduce((s,i) => s + i.amount, 0)
            };
        }

        function generateTasks() {
            let today = new Date().toISOString().slice(0,10);
            let morning = [], evening = [];
            parties.forEach(p => {
                if(p.currentStage === 'zomachivanie') {
                    let soak = new Date(p.createdAt);
                    let ready = new Date(soak.getTime() + 12*3600000);
                    if(ready.toISOString().slice(0,10) === today) evening.push('🌱 Посеять ' + p.culture);
                }
                if(p.currentStage === 'posev' || p.currentStage === 'v_temi' || p.currentStage === 'pod_lampoy') {
                    morning.push('🌱 Проветрить ' + p.culture);
                    evening.push('🌱 Проветрить ' + p.culture);
                    if(cultures[p.culture]?.type === 'sprouts') {
                        morning.push('💧 Промыть ' + p.culture);
                        evening.push('💧 Промыть ' + p.culture);
                    }
                }
                if(p.currentStage === 'srezka' || p.currentStage === 'sbor') morning.push('✂️ Срезать ' + p.culture);
            });
            orders.filter(o => o.date === today).forEach(o => morning.push('📦 Отдать заказ ' + getClientName(o.clientId)));
            return { morning, evening };
        }

        function renderDashboard() {
            let fin = getFinancialStats();
            document.getElementById('incomeStats').innerHTML = '<div class="stat-card"><div class="stat-number">' + fin.dayIncome + '₽</div><div>За день</div></div><div class="stat-card"><div class="stat-number">' + fin.weekIncome + '₽</div><div>За неделю</div></div><div class="stat-card"><div class="stat-number">' + clients.length + '</div><div>Клиенты</div></div>';
            document.getElementById('totalIncome').textContent = fin.totalIncome + '₽';
            document.getElementById('totalExpenses').textContent = fin.totalExpenses + '₽';
            document.getElementById('currentBalance').textContent = fin.currentBalance + '₽';
            
            let tasks = generateTasks();
            document.getElementById('plansContainer').innerHTML = '<div class="plan-section"><div class="plan-time">🌅 УТРО (7:00)</div>' + (tasks.morning.map(t => '<div class="task-item"><input type="checkbox"><span class="task-text">' + t + '</span></div>').join('') || '<div class="empty-state">Нет задач</div>') + '<div class="plan-time">🌙 ВЕЧЕР (20:00)</div>' + (tasks.evening.map(t => '<div class="task-item"><input type="checkbox"><span class="task-text">' + t + '</span></div>').join('') || '<div class="empty-state">Нет задач</div>') + '</div>';
            
            let active = parties.filter(p => p.currentStage !== 'srezka' && p.currentStage !== 'sbor').slice(0,3);
            document.getElementById('activePartiesList').innerHTML = active.map(p => '<div class="card"><div class="card-header"><span>🌱 ' + p.culture + ' #' + p.id.slice(-4) + '</span><span class="status status-' + p.currentStage + '">' + getStageName(p.currentStage) + '</span></div><div class="progress-bar"><div class="progress-fill" style="width:' + getProgress(p) + '%"></div></div><div class="card-details">' + p.container + ' • ' + p.weight + 'г • ' + p.dateSown + '</div><button class="btn-small btn-secondary" onclick="nextStage(\'' + p.id + '\')">Следующий этап</button></div>').join('') || '<div class="empty-state">Нет партий</div>';
        }

        window.nextStage = function(id) {
            let p = parties.find(p => p.id === id);
            if(p) {
                let stages = getStages(p.culture);
                let idx = stages.indexOf(p.currentStage);
                if(idx < stages.length - 1) {
                    p.currentStage = stages[idx + 1];
                    saveData();
                    renderDashboard();
                    renderParties();
                } else alert('Партия завершена!');
            }
        };

        function renderParties() {
            let list = document.getElementById('partiesList');
            list.innerHTML = parties.slice().reverse().map(p => '<div class="card"><div class="card-header"><span>🌱 ' + p.culture + ' #' + p.id.slice(-4) + '</span><span class="status status-' + p.currentStage + '">' + getStageName(p.currentStage) + '</span></div><div class="progress-bar"><div class="progress-fill" style="width:' + getProgress(p) + '%"></div></div><div class="card-details">' + p.container + ' • ' + p.weight + 'г • ' + p.dateSown + '</div><div class="flex-btns"><button class="btn-small btn-secondary" onclick="nextStage(\'' + p.id + '\')">➡️</button><button class="btn-small btn-danger" onclick="deleteParty(\'' + p.id + '\')">🗑️</button></div></div>').join('') || '<div class="empty-state">Нет партий</div>';
        }
        window.deleteParty = function(id) { if(confirm('Удалить?')) { parties = parties.filter(p => p.id !== id); saveData(); renderDashboard(); renderParties(); } };

        function renderOrders() {
            let list = document.getElementById('ordersList');
            list.innerHTML = orders.slice().reverse().map(o => '<div class="card"><div class="card-header"><span>📦 ' + getClientName(o.clientId) + '</span><div><span class="status ' + (o.paid ? 'status-paid' : 'status-unpaid') + '">' + (o.paid ? 'Оплачен' : 'Не оплачен') + '</span><span class="status ' + (o.delivered ? 'status-delivered' : 'status-pending') + '">' + (o.delivered ? 'Выдан' : 'Не выдан') + '</span></div></div><div class="card-details">' + o.culture + ' • ' + o.weight + 'г = ' + o.price + '₽</div><div class="card-details">📅 ' + o.date + '</div><div class="flex-btns"><button class="btn-small btn-secondary" onclick="toggleOrderPaid(\'' + o.id + '\')">' + (o.paid ? 'Снять оплату' : 'Оплатить') + '</button><button class="btn-small btn-secondary" onclick="toggleOrderDelivered(\'' + o.id + '\')">' + (o.delivered ? 'Отменить' : 'Выдать') + '</button><button class="btn-small btn-danger" onclick="deleteOrder(\'' + o.id + '\')">🗑️</button></div></div>').join('') || '<div class="empty-state">Нет заказов</div>';
        }
        window.toggleOrderPaid = function(id) { let o = orders.find(o => o.id === id); if(o) { o.paid = !o.paid; saveData(); renderOrders(); renderDashboard(); } };
        window.toggleOrderDelivered = function(id) { let o = orders.find(o => o.id === id); if(o) { o.delivered = !o.delivered; saveData(); renderOrders(); } };
        window.deleteOrder = function(id) { if(confirm('Удалить?')) { orders = orders.filter(o => o.id !== id); saveData(); renderOrders(); renderDashboard(); } };

        function renderSales() {
            let list = document.getElementById('salesList');
            list.innerHTML = sales.slice().reverse().map(s => '<div class="card"><div class="card-header"><span>💰 ' + getClientName(s.clientId) + '</span><span class="status ' + (s.paid ? 'status-paid' : 'status-unpaid') + '">' + (s.paid ? 'Оплачено' : 'Не оплачено') + '</span></div><div class="card-details">' + s.culture + ' • ' + s.weight + 'г • ' + s.amount + '₽</div><div class="card-details">📅 ' + s.date + '</div><div class="flex-btns"><button class="btn-small btn-secondary" onclick="toggleSalePaid(\'' + s.id + '\')">' + (s.paid ? 'Снять оплату' : 'Оплатить') + '</button><button class="btn-small btn-danger" onclick="deleteSale(\'' + s.id + '\')">🗑️</button></div></div>').join('') || '<div class="empty-state">Нет продаж</div>';
        }
        window.toggleSalePaid = function(id) { let s = sales.find(s => s.id === id); if(s) { s.paid = !s.paid; saveData(); renderDashboard(); renderSales(); } };
        window.deleteSale = function(id) { if(confirm('Удалить?')) { sales = sales.filter(s => s.id !== id); saveData(); renderDashboard(); renderSales(); } };

        function renderClients(filter) {
            filter = filter || '';
            let filtered = filter ? clients.filter(c => c.name.toLowerCase().includes(filter.toLowerCase())) : clients;
            document.getElementById('clientsList').innerHTML = filtered.map(c => '<div class="card"><div class="card-header"><span>👤 ' + c.name + '</span></div><div class="card-details">📍 ' + (c.place || '—') + ' • 📞 ' + (c.contact || '—') + '</div><div class="flex-btns"><button class="btn-small btn-secondary" onclick="quickOrder(\'' + c.id + '\')">📦 Заказ</button><button class="btn-small btn-secondary" onclick="quickSale(\'' + c.id + '\')">💰 Продажа</button><button class="btn-small btn-danger" onclick="deleteClient(\'' + c.id + '\')">🗑️</button></div></div>').join('') || '<div class="empty-state">Нет клиентов</div>';
        }
        window.quickOrder = function(id) { showModal('newOrderModal'); setTimeout(() => document.getElementById('orderClient').value = id, 100); };
        window.quickSale = function(id) { showModal('newSaleModal'); setTimeout(() => document.getElementById('saleClient').value = id, 100); };
        window.deleteClient = function(id) { if(confirm('Удалить?')) { clients = clients.filter(c => c.id !== id); saveData(); renderClients(); fillSelectors(); } };
        window.filterClients = function() { renderClients(document.getElementById('clientSearch').value); };

        function renderExpenses() {
            document.getElementById('expensesList').innerHTML = expenses.slice().reverse().map(e => '<div class="card"><div class="card-header"><span>💸 ' + e.name + '</span><span class="status status-pending">' + e.category + '</span></div><div class="card-details">📅 ' + e.date + ' • ' + e.amount + '₽</div><div class="flex-btns"><button class="btn-small btn-danger" onclick="deleteExpense(\'' + e.id + '\')">🗑️</button></div></div>').join('') || '<div class="empty-state">Нет расходов</div>';
        }
        window.deleteExpense = function(id) { if(confirm('Удалить?')) { expenses = expenses.filter(e => e.id !== id); saveData(); renderExpenses(); renderDashboard(); } };

        function renderAchievements() {
            document.getElementById('achievementsList').innerHTML = achievements.slice().reverse().map(a => '<div class="card"><div class="card-header"><span>🏆 ' + a.description + '</span><button class="btn-small btn-danger" onclick="deleteAchievement(\'' + a.id + '\')">🗑️</button></div><div class="card-details">📅 ' + a.date + ' • ' + a.category + '</div></div>').join('') || '<div class="empty-state">Нет достижений</div>';
        }
        window.deleteAchievement = function(id) { if(confirm('Удалить?')) { achievements = achievements.filter(a => a.id !== id); saveData(); renderAchievements(); } };

        function renderLibrary() {
            document.getElementById('culturesList').innerHTML = Object.keys(cultures).map(name => '<div class="card"><div class="card-header"><span>🌱 ' + name.toUpperCase() + '</span></div><div class="card-details">Тип: ' + (cultures[name].type === 'microgreen' ? 'Микрозелень' : 'Проростки') + '<br>Норма 8×5: ' + cultures[name].norm8 + 'г<br>Дней: ' + cultures[name].daysToReady + '</div></div>').join('');
        }

        function fillSelectors() {
            let cult = document.getElementById('partyCulture');
            if(cult) cult.innerHTML = Object.keys(cultures).map(c => '<option>' + c + '</option>').join('');
            document.getElementById('orderCulture').innerHTML = Object.keys(cultures).map(c => '<option>' + c + '</option>').join('');
            document.getElementById('saleCulture').innerHTML = Object.keys(cultures).map(c => '<option>' + c + '</option>').join('');
            document.getElementById('orderClient').innerHTML = clients.map(c => '<option value="' + c.id + '">' + c.name + '</option>').join('');
            document.getElementById('saleClient').innerHTML = clients.map(c => '<option value="' + c.id + '">' + c.name + '</option>').join('');
        }

        document.getElementById('newPartyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            parties.push({id:'p' + Date.now(), culture: document.getElementById('partyCulture').value, container: document.getElementById('partyContainer').value, weight: parseInt(document.getElementById('partyWeight').value), dateSown: document.getElementById('partyDate').value, currentStage: 'zomachivanie', createdAt: new Date().toISOString()});
            saveData();
            hideModal('newPartyModal');
            renderDashboard();
            renderParties();
            alert('Партия создана!');
        });
        document.getElementById('newOrderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            orders.push({id:'o' + Date.now(), clientId: document.getElementById('orderClient').value, date: document.getElementById('orderDate').value, culture: document.getElementById('orderCulture').value, weight: parseInt(document.getElementById('orderWeight').value), price: parseInt(document.getElementById('orderPrice').value), paid: false, delivered: false});
            saveData();
            hideModal('newOrderModal');
            renderOrders();
            renderDashboard();
            alert('Заказ создан!');
        });
        document.getElementById('newSaleForm').addEventListener('submit', function(e) {
            e.preventDefault();
            sales.push({id:'s' + Date.now(), clientId: document.getElementById('saleClient').value, date: document.getElementById('saleDate').value, culture: document.getElementById('saleCulture').value, weight: parseInt(document.getElementById('saleWeight').value), amount: parseInt(document.getElementById('saleAmount').value), paid: document.getElementById('salePaid').value === 'true'});
            saveData();
            hideModal('newSaleModal');
            renderDashboard();
            renderSales();
            alert('Продажа записана!');
        });
        document.getElementById('newClientForm').addEventListener('submit', function(e) {
            e.preventDefault();
            clients.push({id:'c' + Date.now(), name: document.getElementById('clientName').value, place: document.getElementById('clientPlace').value, contact: document.getElementById('clientContact').value});
            saveData();
            hideModal('newClientModal');
            renderClients();
            fillSelectors();
            alert('Клиент добавлен!');
        });
        document.getElementById('newExpenseForm').addEventListener('submit', function(e) {
            e.preventDefault();
            expenses.push({id:'e' + Date.now(), date: document.getElementById('expenseDate').value, name: document.getElementById('expenseName').value, amount: parseInt(document.getElementById('expenseAmount').value), category: document.getElementById('expenseCategory').value});
            saveData();
            hideModal('newExpenseModal');
            renderExpenses();
            renderDashboard();
            alert('Расход добавлен!');
        });
        document.getElementById('newAchievementForm').addEventListener('submit', function(e) {
            e.preventDefault();
            achievements.push({id:'a' + Date.now(), date: document.getElementById('achievementDate').value, description: document.getElementById('achievementDesc').value, category: document.getElementById('achievementCategory').value});
            saveData();
            hideModal('newAchievementModal');
            renderAchievements();
            alert('Достижение добавлено!');
        });

        window.showModal = function(id) { fillSelectors(); document.getElementById(id).style.display = 'block'; };
        window.hideModal = function(id) { document.getElementById(id).style.display = 'none'; };

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                this.classList.add('active');
                let sec = this.getAttribute('data-section');
                document.getElementById(sec).classList.add('active');
                if(sec === 'dashboard') renderDashboard();
                if(sec === 'parties') renderParties();
                if(sec === 'orders') renderOrders();
                if(sec === 'sales') renderSales();
                if(sec === 'clients') renderClients();
                if(sec === 'expenses') renderExpenses();
                if(sec === 'achievements') renderAchievements();
                if(sec === 'library') renderLibrary();
            });
        });
        
        document.querySelectorAll('.plan-tab').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.plan-tab').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                let tasks = generateTasks();
                let type = this.getAttribute('data-plan');
                if(type === 'today') {
                    document.getElementById('plansContainer').innerHTML = '<div class="plan-section"><div class="plan-time">🌅 УТРО (7:00)</div>' + (tasks.morning.map(t => '<div class="task-item"><input type="checkbox"><span class="task-text">' + t + '</span></div>').join('') || '<div class="empty-state">Нет задач</div>') + '<div class="plan-time">🌙 ВЕЧЕР (20:00)</div>' + (tasks.evening.map(t => '<div class="task-item"><input type="checkbox"><span class="task-text">' + t + '</span></div>').join('') || '<div class="empty-state">Нет задач</div>') + '</div>';
                } else {
                    document.getElementById('plansContainer').innerHTML = '<div class="plan-section"><div class="plan-time">🌅 УТРО (7:00)</div><div class="empty-state">Планы на завтра появятся вечером</div><div class="plan-time">🌙 ВЕЧЕР (20:00)</div><div class="empty-state">Планы на завтра появятся вечером</div></div>';
                }
            });
        });

        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'});
        
        loadData();
        renderDashboard();
        renderParties();
        renderOrders();
        renderSales();
        renderClients();
        renderExpenses();
        renderAchievements();
        renderLibrary();
        fillSelectors();
    </script>
</body>
</html>
